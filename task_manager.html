<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công việc của tôi</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.05);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            min-height: 100vh;
            background: var(--bg-gradient);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 10vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.5s ease-out;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 24px;
            text-align: center;
            background: linear-gradient(to right, #c084fc, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
        }

        input[type="text"] {
            flex: 1;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 14px 16px;
            color: var(--text-main);
            font-size: 16px;
            outline: none;
            transition: all 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
            background: rgba(0, 0, 0, 0.3);
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 0 24px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-add {
            background: var(--accent);
            color: white;
            box-shadow: 0 4px 14px 0 rgba(139, 92, 246, 0.39);
        }

        .btn-add:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .task-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px;
            transition: all 0.2s;
            animation: fadeIn 0.3s ease-out;
        }

        .task-item:hover {
            background: rgba(255, 255, 255, 0.04);
            transform: translateX(4px);
        }

        .task-text {
            font-size: 16px;
            flex: 1;
            word-break: break-word;
            outline: none;
            padding: 4px;
            border-radius: 4px;
        }
        
        .task-text:focus {
            background: rgba(255, 255, 255, 0.05);
        }

        .actions {
            display: flex;
            gap: 8px;
            margin-left: 16px;
        }

        .btn-icon {
            background: transparent;
            color: var(--text-muted);
            padding: 8px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-icon:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
        }

        .btn-icon.delete:hover {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        
        .empty-state {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            padding: 20px 0;
            display: none;
        }
        
        .task-list:empty + .empty-state {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Công việc của tôi</h1>
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Bạn muốn làm gì hôm nay?" onkeypress="if(event.key === 'Enter') addTask()">
            <button class="btn-add" onclick="addTask()">Thêm</button>
        </div>
        <ul class="task-list" id="taskList"></ul>
        <div class="empty-state">Chưa có công việc nào. Bắt đầu thêm ngay!</div>
    </div>

    <script>
        const taskInput = document.getElementById('taskInput');
        const taskList = document.getElementById('taskList');
        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];

        function render() {
            taskList.innerHTML = tasks.map((task, index) => `
                <li class="task-item">
                    <!-- Tính năng sửa: Dùng contenteditable="true" để sửa trực tiếp văn bản -->
                    <span class="task-text" contenteditable="true" onblur="updateTask(${index}, this.innerText)">${task}</span>
                    <div class="actions">
                        <button class="btn-icon delete" onclick="deleteTask(${index})" title="Xóa">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
                            </svg>
                        </button>
                    </div>
                </li>
            `).join('');
        }

        function save() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
        }

        function addTask() {
            const val = taskInput.value.trim();
            if (!val) return;
            tasks.push(val);
            taskInput.value = '';
            save();
            render();
        }

        function updateTask(index, newVal) {
            if (!newVal.trim()) {
                deleteTask(index);
                return;
            }
            tasks[index] = newVal.trim();
            save();
        }

        function deleteTask(index) {
            tasks.splice(index, 1);
            save();
            render();
        }

        render();
    </script>
</body>
</html>
