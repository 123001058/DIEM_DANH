<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Điểm Danh Sinh Viên</title>
<meta name="description" content="Nhập MSSV để điểm danh sau khi quét mã QR.">
<meta name="theme-color" content="#f5f6f8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/checkin.css">
<!-- BẮT BUỘC: Supabase CDN phải nằm trước js/config.js -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
</head>
<body>
<div class="bg-grid"></div>
<main class="wrap">
  <div class="card rise">
    <div class="brand">
      <div class="brand-mark">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
    </div>
    <h1 class="gradient-text">Điểm danh sinh viên</h1>
    <p class="sub">Nhập MSSV và xác nhận để điểm danh</p>

    <div class="info-box" id="sessionInfo">Đang tải thông tin phiên...</div>
    <div id="studentAuthBanner" style="display:none;background:var(--info-bg);color:var(--info);padding:10px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;margin-bottom:16px;"></div>

    <div class="field">
      <label for="mssv">MSSV <span class="req">*</span></label>
      <input type="text" id="mssv" placeholder="Nhập mã số sinh viên" autocomplete="off" inputmode="numeric">
      <span class="field-hint" id="mssvHint">✓ Hệ thống tự ghi nhớ MSSV cho các lần sau</span>
    </div>
    <div class="field">
      <label for="category">Lĩnh vực <span class="req">*</span></label>
      <select id="category" required>
        <option value="">-- Chọn lĩnh vực --</option>
      </select>
    </div>
    <div class="field">
      <label for="note">Ghi chú (không bắt buộc)</label>
      <input type="text" id="note" placeholder="Ghi chú nếu có" autocomplete="off" maxlength="200">
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="btnCheckin" onclick="doCheckin()">Xác nhận điểm danh</button>
      <button class="btn btn-secondary" onclick="location.reload()">Làm mới</button>
    </div>
    <div class="loader" id="loader"><span class="spin"></span>Đang xử lý...</div>
    <div class="badge" id="badge" role="status"></div>
    <a class="back" href="index.html">← Về trang chủ</a>
  </div>
</main>
<script src="js/checkin.js"></script>
</body>
</html>
