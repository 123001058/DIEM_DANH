<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LH-NaviX — Điểm danh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<style>
body{display:flex;align-items:flex-start;justify-content:center;padding:20px;min-height:100vh}
.wrap{max-width:460px;width:100%}
.card{padding:28px 26px 22px}
.header{text-align:center;margin-bottom:20px}
.logo{font-size:23px;font-weight:800;letter-spacing:-.03em}
.sub{color:var(--muted);font-size:13px;margin-top:3px}
.user-box{padding:13px 14px;background:var(--info-bg);border:1px solid rgba(42,91,215,.12);border-radius:var(--radius-sm);display:flex;align-items:center;gap:11px;margin-bottom:16px}
.avatar{width:38px;height:38px;flex:none;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;display:grid;place-items:center;font-size:15px;font-weight:800;text-transform:uppercase}
.user-info{min-width:0;flex:1}
.user-name{font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-id{color:var(--muted);font-size:11.5px;margin-top:1px}
.logout{flex:none;background:none;border:none;color:var(--err);font-size:11.5px;font-weight:700;cursor:pointer;padding:4px 6px;border-radius:6px;font-family:inherit}
.logout:hover{background:rgba(194,56,46,.08)}
.session{padding:14px;border-radius:var(--radius-sm);border:1px solid;margin-bottom:16px;transition:.2s}
.session.state-open{background:var(--ok-bg);border-color:rgba(15,122,74,.2)}
.session.state-warn{background:var(--warn-bg);border-color:rgba(161,92,0,.28)}
.session.state-closed{background:var(--err-bg);border-color:rgba(194,56,46,.2)}
.session.state-loading{background:var(--surface-2);border-color:var(--border)}
.session-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:7px}
.status{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.state-open .status{color:var(--ok)}
.state-warn .status{color:var(--warn)}
.state-closed .status{color:var(--err)}
.state-loading .status{color:var(--muted)}
.status-dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.state-open .status-dot{animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(15,122,74,.45)}100%{box-shadow:0 0 0 8px rgba(15,122,74,0)}}
.session-time{font-size:11px;font-weight:700}
.state-open .session-time{color:var(--ok)}
.state-warn .session-time{color:var(--warn)}
.state-closed .session-time{color:var(--err)}
.session-name{color:var(--text);font-size:14px;font-weight:800}
.session-meta{display:flex;flex-wrap:wrap;gap:7px 14px;color:var(--muted);font-size:11.5px;margin-top:5px}
.session-meta code{font-family:ui-monospace,monospace;font-size:10.5px;background:rgba(0,0,0,.05);padding:1px 5px;border-radius:4px}
.session-countdown{margin-top:9px;padding-top:9px;border-top:1px dashed rgba(0,0,0,.12);font-size:11.5px;font-weight:700}
.state-open .session-countdown{color:var(--ok);border-top-color:rgba(15,122,74,.25)}
.state-warn .session-countdown{color:var(--warn);border-top-color:rgba(161,92,0,.28)}
.state-closed .session-countdown{color:var(--err);border-top-color:rgba(194,56,46,.25)}
.qr-zone{margin-bottom:16px}
.scan-btn{width:100%;padding:14px;border-radius:12px;border:1.5px dashed #3b82f6;background:rgba(59,130,246,.06);color:#2563eb;font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s;font-family:inherit}
.scan-btn:hover{background:rgba(59,130,246,.1)}
.scan-btn.scanned{border-style:solid;border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.qr-status{margin-top:8px;padding:8px 12px;border-radius:8px;font-size:11.5px;font-weight:600}
.qr-status.has-token{background:var(--ok-bg);color:var(--ok)}
.qr-status.no-token{background:var(--warn-bg);color:var(--warn)}
.scanner{margin-bottom:14px;background:var(--surface-2);padding:12px;border-radius:12px;border:1px solid var(--border)}
.scanner-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px;font-weight:700}
.scanner-head button{background:none;border:none;color:var(--err);font-weight:700;cursor:pointer;font-size:12px;font-family:inherit}
#qrReader{width:100%;max-width:320px;margin:0 auto;border-radius:8px;overflow:hidden;background:#000}
#qrReader video{width:100%!important;height:auto!important;border-radius:8px;object-fit:cover}
.field{margin-bottom:14px}
.label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.req{color:var(--err)}
input,select{width:100%;padding:12px 14px;border-radius:var(--radius-sm);border:1px solid var(--border-strong);font-size:14px;outline:none;background:var(--surface);color:var(--text);transition:.15s;font-family:inherit}
input:focus,select:focus{border-color:var(--text);box-shadow:0 0 0 4px #eceef2}
input[readonly]{background:var(--surface-2);color:var(--muted)}
.hint{display:block;font-size:11px;color:var(--muted);margin-top:5px}
.btn-main{width:100%;padding:14px;border-radius:var(--radius-sm);background:var(--text);color:#fff;font-weight:700;font-size:14px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s;font-family:inherit}
.btn-main:hover:not(:disabled){background:#2b2f37}
.btn-main:disabled{background:#d9dce2;color:#8b919c;cursor:not-allowed}
.spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.result{margin-top:14px;padding:15px;border-radius:var(--radius-sm);font-size:13px;line-height:1.65;border:1px solid;display:none;animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.result.show{display:block}
.result.success{background:var(--ok-bg);color:var(--ok);border-color:rgba(15,122,74,.2)}
.result.error{background:var(--err-bg);color:var(--err);border-color:rgba(194,56,46,.2)}
.result.warning{background:var(--warn-bg);color:var(--warn);border-color:rgba(161,92,0,.2)}
.result-title{font-weight:800;font-size:14px}
.result-info{color:var(--muted);font-size:11.5px;margin-top:5px}
.stat-summary{margin-top:11px;padding-top:11px;border-top:1px dashed rgba(15,122,74,.25);display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.stat-item{padding:6px 4px;background:rgba(255,255,255,.55);border-radius:6px}
.stat-item b{display:block;font-size:17px;font-weight:800;line-height:1.15}
.stat-item span{display:block;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);margin-top:1px}
.stat-item.c-present b{color:var(--ok)}
.stat-item.c-absent b{color:var(--err)}
.stat-item.c-unmarked b{color:var(--muted)}
.wake{margin-top:15px;padding:10px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.wake-text{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700}
.wake-desc{color:var(--muted);font-size:10px;font-weight:500;margin-top:1px}
.switch{width:38px;height:22px;border:0;border-radius:20px;background:#cfd3da;position:relative;cursor:pointer;flex:none;transition:.15s}
.switch::after{content:"";position:absolute;width:16px;height:16px;top:3px;left:3px;background:#fff;border-radius:50%;transition:.15s}
.switch.active{background:var(--ok)}
.switch.active::after{left:19px}
.history{margin-top:16px}
.history-toggle{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:12.5px;font-weight:700;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-family:inherit}
.history-toggle .chev{transition:transform .2s}
.history-toggle.open .chev{transform:rotate(180deg)}
.history-list{margin-top:8px;border:1px solid var(--border);border-radius:10px;overflow:hidden;display:none}
.history-list.open{display:block}
.history-item{padding:12px 13px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.history-item:last-child{border-bottom:0}
.history-date{font-size:11px;color:var(--muted)}
.history-name{font-size:12px;font-weight:700;margin-top:2px}
.history-status{flex:none;font-size:11px;font-weight:800}
.history-status.ok{color:var(--ok)}
.history-status.absent{color:var(--err)}
.history-empty{padding:24px 14px;text-align:center;color:var(--muted);font-size:12.5px}
.footer{text-align:center;margin-top:20px;color:var(--faint);font-size:10.5px}
@media(max-width:480px){body{padding:10px}.card{padding:22px 17px 18px;border-radius:14px}.logo{font-size:21px}}
</style>
<script src="js/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js?v=5"></script>
</head>
<body>
<div class="bg-grid"></div>
<div class="wrap">
  <div class="card">
    <header class="header">
      <div class="logo">LH-NaviX</div>
      <div class="sub">Điểm danh sinh viên</div>
    </header>

    <section class="user-box">
      <div class="avatar" id="userAvatar">?</div>
      <div class="user-info">
        <div class="user-name" id="userName">Đang tải...</div>
        <div class="user-id" id="userId">—</div>
      </div>
      <button class="logout" onclick="logoutStudent()">Đăng xuất</button>
    </section>

    <section class="session state-loading" id="sessionBox">
      <div class="session-top">
        <div class="status"><span class="status-dot"></span><span id="sessionStatusText">Đang kiểm tra...</span></div>
        <div class="session-time" id="sessionTime"></div>
      </div>
      <div class="session-name" id="sessionName">—</div>
      <div class="session-meta" id="sessionMeta"></div>
      <div class="session-countdown" id="sessionCountdown"></div>
    </section>

    <div class="qr-zone">
      <button class="scan-btn" id="scanBtn" onclick="toggleCameraScanner()">📷 Bật camera quét mã QR</button>
      <div class="qr-status no-token" id="qrStatus">⚠️ Chưa có mã QR</div>
    </div>

    <div class="scanner" id="scannerWrapper" style="display:none">
      <div class="scanner-head">
        <span>🎥 Đưa camera vào mã QR trên màn hình Admin</span>
        <button onclick="stopCameraScanner()">✕ Đóng</button>
      </div>
      <div id="qrReader"></div>
    </div>

    <div class="field">
      <label class="label">MSSV <span class="req">*</span></label>
      <input type="text" id="mssv" readonly>
      <span class="hint">🔒 Tài khoản hiện tại</span>
    </div>

    <div class="field">
      <label class="label">Lĩnh vực <span class="req">*</span></label>
      <select id="category"><option value="">-- Chọn lĩnh vực --</option></select>
    </div>

    <div class="field">
      <label class="label">Ghi chú</label>
      <input type="text" id="note" placeholder="Không bắt buộc" maxlength="200">
    </div>

    <button class="btn-main" id="btnCheckin" onclick="doCheckin()">✓ Xác nhận điểm danh</button>
    <div class="result" id="resultBox"></div>

    <div class="wake">
      <div>
        <div class="wake-text">☀️ Giữ màn hình sáng</div>
        <div class="wake-desc">Không tự tắt màn hình khi đang điểm danh</div>
      </div>
      <button class="switch" id="wakeSwitch" onclick="toggleWakeLock()"></button>
    </div>

    <section class="history">
      <button class="history-toggle" onclick="toggleHistory(this)">
        <span>📋 Lịch sử điểm danh</span>
        <span class="chev">⌄</span>
      </button>
      <div class="history-list" id="historyList"></div>
    </section>

    <footer class="footer">LH-NaviX · v2.0.0</footer>
  </div>
</div>

<script>
let currentUser = null, currentProfile = null;
let currentSession = null, sessionToken = null;
let deviceId = '', scanner = null, isScanning = false, refreshTimer = null;

function getDeviceId(){
  let id = localStorage.getItem('device_id');
  if (!id){ id = 'dev_' + Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('device_id', id); }
  return id;
}
function fmtTime(sec){ return String(Math.floor(sec/60)).padStart(2,'0') + ':' + String(sec%60).padStart(2,'0'); }
function showResult(type, html){ const b = document.getElementById('resultBox'); b.className = 'result ' + type + ' show'; b.innerHTML = html; }
function hideResult(){ document.getElementById('resultBox').className = 'result'; }

async function toggleCameraScanner(){ if (isScanning) stopCameraScanner(); else await startCameraScanner(); }

async function startCameraScanner(){
  if (!window.Html5Qrcode) return showResult('error', 'Không tải được thư viện quét QR.');
  document.getElementById('scannerWrapper').style.display = 'block';
  document.getElementById('scanBtn').style.display = 'none';
  if (!scanner) scanner = new Html5Qrcode('qrReader');
  const cfg = { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 };
  try {
    isScanning = true;
    await scanner.start({ facingMode: 'environment' }, cfg, onScanSuccess, () => {});
  } catch(e){
    try { await scanner.start({ facingMode: 'user' }, cfg, onScanSuccess, () => {}); }
    catch(e2){ isScanning = false; stopCameraScanner(); showResult('error', 'Không mở được camera. Vui lòng cấp quyền.'); }
  }
}
async function stopCameraScanner(){
  document.getElementById('scannerWrapper').style.display = 'none';
  document.getElementById('scanBtn').style.display = 'flex';
  if (scanner && isScanning){ try { await scanner.stop(); } catch(e){} isScanning = false; }
  updateScanBtn();
}
function updateScanBtn(){
  const btn = document.getElementById('scanBtn');
  const st = document.getElementById('qrStatus');
  if (sessionToken){
    btn.classList.add('scanned');
    btn.innerHTML = '✓ Đã có mã QR (Bấm để quét lại)';
    st.className = 'qr-status has-token';
    st.innerHTML = '✓ Đã nhận mã QR — Sẵn sàng điểm danh';
  } else {
    btn.classList.remove('scanned');
    btn.innerHTML = '📷 Bật camera quét mã QR';
    st.className = 'qr-status no-token';
    st.innerHTML = '⚠️ Chưa có mã QR — Hãy quét mã từ màn hình';
  }
}
function parseQr(text){
  let s = null, t = null;
  try { if (text.startsWith('http')){ const u = new URL(text); s = u.searchParams.get('s'); t = u.searchParams.get('t'); } } catch(e){}
  if (!t){ const mt = text.match(/[?&]t=([^&]+)/); const ms = text.match(/[?&]s=([^&]+)/); if (mt) t = decodeURIComponent(mt[1]); if (ms) s = decodeURIComponent(ms[1]); }
  if (!t && /^[0-9a-f]{20,}$/i.test(text.trim())) t = text.trim();
  return { s, t };
}
async function onScanSuccess(decodedText){
  const { s, t } = parseQr(decodedText);
  if (!t) return showResult('warning', 'Mã QR không đúng định dạng điểm danh.');
  sessionToken = t;
  if (s) currentSession = { ...(currentSession || {}), id: s };
  await stopCameraScanner();
  playChime();
  showResult('success', '✓ Đã nhận mã QR — Bấm "Xác nhận điểm danh" để hoàn tất.');
}
function playChime(){
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.frequency.setValueAtTime(587.33, ctx.currentTime);
    osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1);
    g.gain.setValueAtTime(0.12, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
    osc.connect(g).connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.35);
  } catch(e){}
}
async function loadProfile(){
  const { data: auth } = await supabase.auth.getSession();
  if (!auth?.session){ location.href = 'index.html'; return false; }
  currentUser = auth.session.user;
  const { data: prof } = await supabase.from('profiles').select('full_name, mssv').eq('user_id', currentUser.id).maybeSingle();
  currentProfile = prof || {};
  const name = currentProfile.full_name || currentUser.email;
  const mssv = currentProfile.mssv || '';
  document.getElementById('userAvatar').textContent = (name || '?').trim().slice(-1).toUpperCase();
  document.getElementById('userName').textContent = name;
  document.getElementById('userId').textContent = 'MSSV: ' + (mssv || '—');
  document.getElementById('mssv').value = mssv;
  if (!mssv){ showResult('error', 'Tài khoản chưa liên kết MSSV. Vui lòng liên hệ Admin.'); return false; }
  return true;
}
async function loadSession(){
  const box = document.getElementById('sessionBox');
  const { data, error } = await supabase.rpc('get_open_session');
  if (error || !data){
    box.className = 'session state-closed';
    document.getElementById('sessionStatusText').textContent = 'Chưa mở';
    document.getElementById('sessionName').textContent = 'Chưa có phiên điểm danh nào đang mở';
    document.getElementById('sessionMeta').innerHTML = '';
    document.getElementById('sessionCountdown').textContent = '';
    currentSession = null;
    updateScanBtn();
    return;
  }
  currentSession = data;
  const { id, session_name, duration_min, started_at } = data;
  box.className = 'session state-open';
  document.getElementById('sessionStatusText').textContent = 'Phiên đang mở';
  document.getElementById('sessionName').textContent = session_name;
  document.getElementById('sessionTime').textContent = new Date(started_at).toLocaleTimeString('vi-VN', { hour:'2-digit', minute:'2-digit' });
  document.getElementById('sessionMeta').innerHTML =
    '<span>🔑 ID: <code>' + String(id).slice(0,8) + '</code></span>' +
    (duration_min ? '<span>⏱ ' + duration_min + ' phút</span>' : '<span>⏱ Không giới hạn</span>');
  if (sessionToken && sessionToken !== data.qr_token){
    sessionToken = null; updateScanBtn();
    showResult('warning', '⚠️ Mã QR đã được đổi. Vui lòng quét lại mã mới.');
  }
  clearInterval(refreshTimer); tickCountdown();
  refreshTimer = setInterval(tickCountdown, 1000);
}
function tickCountdown(){
  if (!currentSession) return;
  const { started_at, duration_min, warn_before_min } = currentSession;
  const el = document.getElementById('sessionCountdown');
  const box = document.getElementById('sessionBox');
  if (!duration_min){ el.textContent = '⏱ Không giới hạn thời gian'; return; }
  const end = new Date(started_at).getTime() + duration_min * 60000;
  const left = Math.max(0, Math.floor((end - Date.now())/1000));
  if (left === 0){
    box.className = 'session state-closed';
    document.getElementById('sessionStatusText').textContent = 'Đã đóng';
    el.textContent = '⏱ Phiên đã kết thúc';
    clearInterval(refreshTimer); currentSession = null; sessionToken = null; updateScanBtn();
    return;
  }
  const warn = (warn_before_min || 5) * 60;
  el.textContent = left <= warn ? '⚠️ Còn ' + fmtTime(left) + ' — Khẩn trương!' : '⏱ Còn ' + fmtTime(left) + ' để điểm danh';
  box.className = left <= warn ? 'session state-warn' : 'session state-open';
}
async function doCheckin(){
  hideResult();
  if (!currentProfile?.mssv) return showResult('error', 'Tài khoản chưa có MSSV.');
  if (!currentSession) return showResult('error', 'Chưa có phiên điểm danh nào mở.');
  if (!sessionToken) return showResult('warning', 'Vui lòng quét mã QR trước khi điểm danh.');
  const category = document.getElementById('category').value;
  const note = document.getElementById('note').value.trim();
  if (!category) return showResult('warning', 'Vui lòng chọn Lĩnh vực.');
  const btn = document.getElementById('btnCheckin');
  btn.disabled = true;
  const oldHTML = btn.innerHTML;
  btn.innerHTML = '<span class="spin"></span> Đang xử lý...';
  try {
    const { data, error } = await supabase.rpc('submit_attendance', {
      p_session_id: String(currentSession.id),
      p_token: sessionToken,
      p_mssv: currentProfile.mssv,
      p_category: category, p_note: note, p_device_id: deviceId
    });
    if (error){ showResult('error', 'Lỗi: ' + error.message); }
    else if (!data?.ok){
      let type = 'error';
      let icon = '✕ ';
      if (data?.code === 'ALREADY'){ type = 'warning'; icon = '✓ '; }
      else if (data?.code === 'HAS_CLASS_SCHEDULE'){ type = 'warning'; icon = '⛔ '; }
      showResult(type, icon + (data.message || 'Điểm danh thất bại.'));
    } else {
      playChime();
      const { data: sum } = await supabase.rpc('get_session_summary', { p_session_id: String(currentSession.id) });
      const statsHTML = sum?.ok ? '<div class="stat-summary">' +
        '<div class="stat-item c-present"><b>' + sum.present + '</b><span>Đã ĐD</span></div>' +
        '<div class="stat-item c-absent"><b>' + sum.absent + '</b><span>Vắng</span></div>' +
        '<div class="stat-item c-unmarked"><b>' + sum.unmarked + '</b><span>Chưa quét</span></div></div>' : '';
      showResult('success',
        '<div class="result-title">✓ Điểm danh thành công</div>' +
        '<div class="result-info"><b>' + escapeHtml(data.name || '') + '</b> · MSSV: <b>' + escapeHtml(data.mssv || '') + '</b><br>' +
        new Date().toLocaleString('vi-VN') + '<br>' +
        'Phiên: ' + escapeHtml(currentSession.session_name) + ' · ' + escapeHtml(category) + '</div>' + statsHTML);
      document.getElementById('note').value = '';
      localStorage.setItem('saved_category', category);
    }
  } catch(e){ showResult('error', 'Lỗi kết nối: ' + e.message); }
  finally { btn.disabled = false; btn.innerHTML = oldHTML; }
}
async function toggleHistory(btn){
  btn.classList.toggle('open');
  const list = document.getElementById('historyList');
  list.classList.toggle('open');
  if (list.classList.contains('open')) await loadHistory();
}
async function loadHistory(){
  const list = document.getElementById('historyList');
  list.innerHTML = '<div class="history-empty">Đang tải...</div>';
  const mssv = currentProfile?.mssv;
  if (!mssv){ list.innerHTML = '<div class="history-empty">Chưa có MSSV.</div>'; return; }
  const { data, error } = await supabase.rpc('get_my_attendance_history', { p_mssv: mssv });
  if (error) {
    list.innerHTML = '<div class="history-empty" style="color:var(--err)">Lỗi DB: ' + escapeHtml(error.message) + '<br><small>(Bạn đã chạy lệnh SQL bên Supabase chưa?)</small></div>';
    return;
  }
  const records = data?.records || [];
  if (!records.length){ list.innerHTML = '<div class="history-empty">Bạn chưa điểm danh phiên nào.</div>'; return; }
  list.innerHTML = records.slice(0, 30).map(r =>
    '<div class="history-item">' +
      '<div><div class="history-date">' + new Date(r.checked_at).toLocaleString('vi-VN') + '</div>' +
      '<div class="history-name">' + escapeHtml(r.session_name || '—') + '</div></div>' +
      '<div class="history-status ' + (r.status === 'có mặt' ? 'ok' : 'absent') + '">' +
      (r.status === 'có mặt' ? '✓ Có mặt' : '✕ ' + r.status) + '</div></div>'
  ).join('');
}
let wakeLock = null, wakeActive = false;
async function toggleWakeLock(){
  if (!('wakeLock' in navigator)) return showResult('warning', 'Trình duyệt không hỗ trợ.');
  if (wakeActive){ try { await wakeLock?.release(); } catch(e){} wakeLock = null; wakeActive = false; }
  else {
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeActive = true;
      wakeLock.addEventListener('release', () => { wakeActive = false; updateWakeUI(); });
    } catch(e){ return showResult('warning', 'Không giữ được màn hình sáng.'); }
  }
  updateWakeUI();
}
function updateWakeUI(){ document.getElementById('wakeSwitch').classList.toggle('active', wakeActive); }
function logoutStudent(){
  if (!confirm('Đăng xuất khỏi tài khoản này?')) return;
  localStorage.removeItem('saved_creds');
  supabase.auth.signOut().then(() => location.href = 'index.html');
}
async function init(){
  deviceId = getDeviceId();
  const catSel = document.getElementById('category');
  (CONFIG.CATEGORIES || []).forEach(c => {
    const o = document.createElement('option'); o.value = c; o.textContent = c; catSel.appendChild(o);
  });
  const savedCat = localStorage.getItem('saved_category');
  if (savedCat) catSel.value = savedCat;
  if (!await loadProfile()) return;
  await loadSession();
  const url = new URL(location.href);
  const t = url.searchParams.get('t');
  if (t){ sessionToken = t; updateScanBtn(); }
  setInterval(loadSession, 15000);
  document.getElementById('note').addEventListener('keydown', e => { if (e.key === 'Enter') doCheckin(); });
  supabase.channel('session_changes')
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'sessions' }, payload => {
      if (currentSession && payload.new.id === currentSession.id){
        if (payload.new.qr_token !== currentSession.qr_token){
          currentSession.qr_token = payload.new.qr_token;
          if (sessionToken){ sessionToken = null; updateScanBtn(); showResult('warning', '⚠️ Mã QR đã được đổi. Vui lòng quét lại.'); }
        }
        if (payload.new.is_open === false){ currentSession = null; loadSession(); }
      }
    }).subscribe();
}
init();
</script>
