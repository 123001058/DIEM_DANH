<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LH-NaviX — Nhiệm Vụ Của Tôi</title>
<meta name="description" content="Xem và cập nhật tiến độ các nhiệm vụ được giao.">
<meta name="theme-color" content="#f5f6f8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/roles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js?v=4"></script>
<script src="js/roles.js?v=1"></script>
</head>
<body>
<div class="bg-grid"></div>
<div class="page-wrapper">

  <header class="card rk-topbar rise">
    <div class="rk-topbar-left">
      <img src="images/logo.png" alt="LH-NaviX" class="logo-sm" width="44" height="44" style="object-fit:contain;border-radius:10px;">
      <div>
        <h1>LH-NaviX</h1>
        <p id="mySubtitle">Đang tải...</p>
      </div>
    </div>
    <div class="rk-topbar-right">
      <span class="rk-role-chip chip-student" id="roleChip">Thành viên</span>
      <a href="checkin.html" class="rk-btn">📷 Điểm danh</a>
      <button class="rk-btn" onclick="roleLogout()">Đăng xuất</button>
    </div>
  </header>

  <div id="pageAlert" class="rk-alert"></div>

  <section class="rk-stats rise rise-2">
    <div class="rk-stat"><div class="rk-stat-label">Chưa bắt đầu</div><div class="rk-stat-value" id="statTodo">0</div></div>
    <div class="rk-stat"><div class="rk-stat-label">Đang thực hiện</div><div class="rk-stat-value info" id="statDoing">0</div></div>
    <div class="rk-stat"><div class="rk-stat-label">Hoàn thành</div><div class="rk-stat-value ok" id="statDone">0</div></div>
  </section>

  <!-- ============ NHIỆM VỤ ĐANG MỞ ============ -->
  <section class="card rk-card rise rise-2">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px;">
      <div>
        <div class="rk-card-title">Nhiệm vụ được giao</div>
        <p class="rk-card-sub" style="margin:0;">Bấm <b>✓ Hoàn thành</b> khi xong việc.</p>
      </div>
      <button class="rk-btn rk-btn-sm" id="btnToggleHistory" onclick="toggleHistory()" style="display:none;">
        📋 Lịch sử
      </button>
    </div>
    <div id="myTaskList">
      <div class="rk-empty">Đang tải nhiệm vụ...</div>
    </div>
  </section>

  <!-- ============ LỊCH SỬ (ẩn mặc định) ============ -->
  <section class="card rk-card rise rise-3" id="historySection" style="display:none;">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;">
      <div class="rk-card-title">📋 Lịch sử giao việc &amp; hoàn thành</div>
      <button class="rk-btn rk-btn-sm" onclick="toggleHistory()">✕ Đóng</button>
    </div>
    <div id="myHistoryList">
      <div class="rk-empty">Đang tải...</div>
    </div>
  </section>

</div>

<script src="js/tasks.js?v=2"></script>
</body>
</html>
