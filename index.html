<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LH-NaviX — Điểm Danh QR</title>
<meta name="description" content="LH-NaviX — Hệ thống điểm danh bằng mã QR động, xác thực thiết bị, chống gian lận.">
<meta name="theme-color" content="#f5f6f8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/index.css">
</head>
<body>
  <div class="bg-grid"></div>
  <main class="card hero rise">
    <div class="logo-wrap">
      <img src="images/logo.png" alt="LH-NaviX Logo" class="logo" width="112" height="112" style="object-fit:contain;border-radius:18px;">
    </div>
    <h1 class="gradient-text">LH-NaviX</h1>
    <p class="sub">Điểm danh nhanh chỉ với một lần quét</p>
    <div class="chips">
      <span class="chip"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>QR động</span>
      <span class="chip"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/></svg>Xác thực thiết bị</span>
      <span class="chip"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Chống gian lận</span>
    </div>
    <div class="divider"></div>
    <div style="display:flex;flex-direction:column;gap:10px;width:100%;">
      <button class="btn btn-primary" id="btnOpenLogin" onclick="openLogin('login')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
        Đăng nhập hệ thống
      </button>
      <button class="btn btn-secondary" id="btnOpenRegister" onclick="openLogin('register')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
        Tạo tài khoản
      </button>
    </div>
    <p class="footer">LH-NaviX · Khơi nguồn sáng tạo · Làm chủ tương lai</p>
  </main>

  <div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeLogin()">
    <div class="card modal" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
      <div class="modal-tabs">
        <button class="modal-tab-btn active" id="tabBtnLogin" onclick="switchAuthTab('login')">Đăng nhập</button>
        <button class="modal-tab-btn" id="tabBtnRegister" onclick="switchAuthTab('register')">Tạo tài khoản</button>
      </div>

      <!-- Form Đăng nhập -->
      <div id="loginFormArea">
        <h2 id="loginTitle" style="font-size:18px;margin-bottom:6px;">Đăng nhập</h2>
        <p style="font-size:13px;color:var(--muted);margin-bottom:16px;">Admin vào trang quản lý · Sinh viên vào form điểm danh</p>
        <input type="text" id="userInput" placeholder="Tên đăng nhập" autocomplete="username">
        <input type="password" id="pwdInput" placeholder="Mật khẩu" autocomplete="current-password">
        <div id="errBox" role="alert"></div>
        <div class="modal-actions">
          <button type="button" onclick="closeLogin()">Huỷ</button>
          <button type="button" class="btn-ok" id="btnLogin" onclick="submitLogin()">Đăng nhập</button>
        </div>
      </div>

      <!-- Form Tạo tài khoản -->
      <div id="registerFormArea" style="display:none;">
        <h2 style="font-size:18px;margin-bottom:6px;">Tạo tài khoản</h2>
        <p style="font-size:13px;color:var(--muted);margin-bottom:14px;">Đăng ký tài khoản Sinh viên vào hệ thống</p>
        <input type="text" id="regUsername" placeholder="Tên đăng nhập" autocomplete="off">
        <input type="password" id="regPassword" placeholder="Mật khẩu (tối thiểu 6 ký tự)" autocomplete="new-password">
        <input type="text" id="regMssv" placeholder="Mã số sinh viên (MSSV)" autocomplete="off">
        <div id="regMsg" role="alert" style="font-size:12.5px;font-weight:600;min-height:18px;margin:2px 0 6px;text-align:left;"></div>
        <div class="modal-actions">
          <button type="button" onclick="closeLogin()">Huỷ</button>
          <button type="button" class="btn-ok" id="btnRegister" onclick="submitRegister()">Tạo tài khoản</button>
        </div>
      </div>
    </div>
  </div>
<!-- BẮT BUỘC: Supabase CDN + config.js phải nằm trước js/auth.js -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js?v=3"></script>
<script src="js/auth.js?v=3"></script>
</body>
</html>
