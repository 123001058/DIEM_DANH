<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hệ Thống Điểm Danh QR</title>
<meta name="description" content="Hệ thống điểm danh bằng mã QR động, xác thực thiết bị, chống gian lận.">
<meta name="theme-color" content="#f5f6f8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/index.css">
</head>
<body>
  <div class="bg-grid"></div>
  <main class="card hero rise">
    <div class="logo-wrap">
      <svg class="logo" width="112" height="112" viewBox="0 0 120 120" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6c653"/><stop offset="1" stop-color="#c8951f"/></linearGradient></defs><circle cx="60" cy="60" r="56" fill="url(#lg)"/><path d="M30 52 L60 38 L90 52 L60 66 Z" fill="#fff"/><rect x="42" y="62" width="36" height="18" rx="2" fill="#fff" opacity="0.9"/></svg>
    </div>
    <h1 class="gradient-text">Hệ thống điểm danh QR</h1>
    <p class="sub">Điểm danh nhanh chỉ với một lần quét</p>
    <div class="chips">
      <span class="chip"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>QR động</span>
      <span class="chip"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/></svg>Xác thực thiết bị</span>
      <span class="chip"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Chống gian lận</span>
    </div>
    <div class="divider"></div>
    <button class="btn btn-primary" id="btnOpenLogin" onclick="openLogin()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
      Đăng nhập quản lý
    </button>
    <p class="footer">Khơi nguồn sáng tạo · Làm chủ tương lai</p>
  </main>

  <div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeLogin()">
    <div class="card modal" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
      <div class="modal-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <h2 id="loginTitle">Đăng nhập quản lý</h2>
      <p>Nhập tên đăng nhập và mật khẩu</p>
      <input type="text" id="userInput" placeholder="Tên đăng nhập" autocomplete="username">
      <input type="password" id="pwdInput" placeholder="Mật khẩu" autocomplete="current-password">
      <div id="errBox" role="alert"></div>
      <div class="modal-actions">
        <button onclick="closeLogin()">Huỷ</button>
        <button class="btn-ok" id="btnLogin" onclick="submitLogin()">Đăng nhập</button>
      </div>
    </div>
  </div>
<!-- BẮT BUỘC: Supabase CDN + config.js phải nằm trước js/auth.js -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
