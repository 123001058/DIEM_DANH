<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LH-NaviX — Điểm Danh QR</title>
  <meta name="theme-color" content="#f5f6f8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/index.css">
</head>

<body>
  <div class="bg-grid"></div>
  <main class="card hero rise">
    <div class="logo-wrap">
      <img src="images/logo.png" alt="LH-NaviX Logo" class="logo" width="112" height="112"
        style="object-fit:contain;border-radius:18px;">
    </div>
    <h1 class="gradient-text">LH-NaviX</h1>
    <p class="sub">Điểm danh nhanh chỉ với một lần quét</p>
    <div class="chips">
      <span class="chip"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.5">
          <path d="M21 12a9 9 0 1 1-3-6.7" />
          <path d="M21 3v6h-6" />
        </svg>QR tĩnh</span>
      <span class="chip"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.5">
          <rect x="5" y="2" width="14" height="20" rx="2" />
          <path d="M12 18h.01" />
        </svg>Xác thực thiết bị</span>
      <span class="chip"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.5">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
        </svg>Chống gian lận</span>
    </div>
    <div class="divider"></div>
    <div style="display:flex;flex-direction:column;gap:10px;width:100%;">
      <button class="btn btn-primary" id="btnOpenLogin" onclick="openLogin()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
          <path d="M10 17l5-5-5-5" />
          <path d="M15 12H3" />
        </svg>
        Đăng nhập hệ thống
      </button>
    </div>
    <p class="footer">LH-NaviX · Khơi nguồn sáng tạo · Làm chủ tương lai</p>
  </main>

  <div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeLogin()">
    <div class="card modal">
      <div class="modal-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <rect x="3" y="11" width="18" height="11" rx="2" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>
      </div>
      <h2>Đăng nhập</h2>
      <p>Sử dụng MSSV và mật khẩu được cấp</p>
      <input type="text" id="mssvInput" placeholder="Mã số sinh viên" autocomplete="username" inputmode="numeric">
      <input type="password" id="pwdInput" placeholder="Mật khẩu" autocomplete="current-password">
      <div id="errBox" role="alert"></div>
      <div class="modal-actions">
        <button type="button" onclick="closeLogin()">Huỷ</button>
        <button type="button" class="btn-ok" id="btnLogin" onclick="submitLogin()">Đăng nhập</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=6"></script>
  <script src="js/auth.js?v=6"></script>
</body>

</html>
