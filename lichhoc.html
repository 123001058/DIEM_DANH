<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LH-NaviX — Thời Khóa Biểu</title>
<meta name="description" content="LH-NaviX — Tra cứu thời khóa biểu sinh viên theo tuần, xem lịch phù hợp với quyền tài khoản.">
<meta name="theme-color" content="#f5f6f8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/lichhoc.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script>
  if (new URLSearchParams(window.location.search).get('embed') === '1') {
    document.documentElement.classList.add('is-embedded');
  }
  function goBackToStudentPortal() {
    if (window.history.length > 1 && document.referrer && !document.referrer.endsWith('index.html')) {
      window.history.back();
    } else {
      window.location.href = 'checkin.html';
    }
  }
</script>
<style>
  .is-embedded .tkb-header,
  .is-embedded .bg-grid { display: none !important; }
  .is-embedded body { background: transparent !important; padding: 0 !important; }
  .is-embedded .page-wrapper { max-width: 100% !important; padding: 12px 14px 24px !important; margin: 0 !important; }
</style>
</head>
<body>
  <div class="bg-grid"></div>

  <div class="page-wrapper">
    <!-- Header -->
    <header class="card tkb-header">
      <div class="tkb-header-left">
        <img src="images/logo.png" alt="LH-NaviX" class="logo-sm" width="44" height="44" style="object-fit:contain;border-radius:10px;">
        <div class="tkb-title-group">
          <h1>LH-NaviX — Thời Khóa Biểu</h1>
          <p>Thời khóa biểu ME · Tra cứu theo tài khoản</p>
        </div>
      </div>
      <nav class="tkb-nav-links">
        <button type="button" onclick="goBackToStudentPortal()" class="nav-pill" style="font-weight:700;background:var(--primary);color:#fff;border-color:transparent;cursor:pointer;" title="Quay lại trang điểm danh sinh viên">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          Quay lại
        </button>
        <a href="checkin.html" class="nav-pill" title="Về trang điểm danh sinh viên">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Trang sinh viên
        </a>
      </nav>
    </header>

    <!-- Controls Panel -->
    <section class="card tkb-controls">
      <div class="controls-row-top">
        <div class="student-select-group" id="studentSelectGroup">
          <label class="input-label" for="studentSelect">Chọn sinh viên tra cứu</label>
          <select id="studentSelect" aria-label="Chọn sinh viên"></select>
          <div class="student-badge-info" id="studentInfoBadge">
            <!-- Dynamic info badge -->
          </div>
        </div>

        <div id="studentSearchGroup">
          <label class="input-label" for="studentSearch">Tìm nhanh tên hoặc MSSV</label>
          <input type="text" id="studentSearch" placeholder="Gõ tên hoặc 4 số cuối MSSV..." autocomplete="off">
        </div>

        <div class="view-tabs" id="timetableViewTabs">
          <button class="tab-btn active" id="tabGrid" title="Xem dạng lưới tuần">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            Lưới tuần
          </button>
          <button class="tab-btn" id="tabToday" title="Xem lịch cả lớp hôm nay">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            Lịch cả lớp
          </button>
          <button class="tab-btn" id="tabFreeTime" title="Tìm những bạn rảnh theo Thứ và Buổi">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            ⚡ Lọc người rảnh
          </button>
          <button class="tab-btn" id="tabList" title="Xem danh sách chi tiết">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            Toàn kỳ
          </button>
        </div>
      </div>

      <div class="controls-row-bottom">
        <div class="week-nav">
          <button class="week-btn" id="btnPrevWeek" title="Tuần trước">◀</button>
          <div class="week-display">
            <span class="week-label" id="weekLabel">Tuần 1</span>
            <span class="week-dates" id="weekDates">28/09/2026 – 04/10/2026</span>
          </div>
          <button class="week-btn" id="btnNextWeek" title="Tuần sau">▶</button>
          <button class="btn-action" id="btnCurrentWeek" style="padding:6px 12px;font-size:12px;margin-left:6px;">Tuần này</button>
        </div>

          <button class="btn-action btn-action-primary" id="btnAddExternalSchedule" style="background:#4f46e5;color:#fff;border-color:transparent;font-weight:600" title="Thêm lịch khóa học ngoài (TOEIC, IELTS, thực tập...)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            ＋ Thêm lịch ngoài
          </button>
          <button class="btn-action" id="btnExportICal" title="Thêm lịch vào Google Calendar / Apple Calendar">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="12" y1="14" x2="12" y2="18"/><line x1="10" y1="16" x2="14" y2="16"/></svg>
            📲 Thêm vào Lịch (.ics)
          </button>
          <button class="btn-action" id="btnExportExcel" title="Xuất file Excel bảng ma trận tuần đẹp mắt">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            📊 Xuất Excel ma trận
          </button>
          <button class="btn-action" id="btnPrintTKB" title="In hoặc Lưu PDF theo chuẩn khổ A4">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
            🖨️ In / Lưu PDF (A4)
          </button>
        </div>
      </div>
    </section>

    <!-- Main Views -->
    <main>
      <div id="timetableContainer" class="timetable-container">
        <!-- Rendered by js/lichhoc.js -->
      </div>

      <div id="todayContainer" style="display:none;">
        <!-- Rendered by js/lichhoc.js -->
      </div>

      <div id="freeTimeContainer" style="display:none;">
        <!-- Rendered by js/lichhoc.js -->
      </div>

      <div id="listContainer" style="display:none;">
        <!-- Rendered by js/lichhoc.js -->
      </div>
    </main>

    <!-- Modal Thêm Lịch Ngoài -->
    <div id="modalExternalSchedule" class="modal-backdrop" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,0.6);backdrop-filter:blur(4px);z-index:9999;align-items:center;justify-content:center;padding:16px;">
      <div class="card modal-content" style="max-width:560px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 25px -5px rgba(0,0,0,0.2),0 8px 10px -6px rgba(0,0,0,0.1);padding:22px 24px;border-radius:14px;position:relative;background:var(--surface);">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:12px;">
          <h2 style="font-size:17px;font-weight:800;color:var(--text);margin:0;display:flex;align-items:center;gap:8px;">
            <span>🗓️</span> <span>Thêm Khóa Học / Lịch Ngoài</span>
          </h2>
          <button type="button" id="btnCloseModalExt" style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);padding:4px 8px;border-radius:6px;">✕</button>
        </div>

        <form id="formExternalSchedule" style="display:flex;flex-direction:column;gap:14px;">
          <div id="extStudentSelectWrap" style="display:none;">
            <label class="input-label" style="font-size:12.5px;font-weight:700;display:block;margin-bottom:5px;">Sinh viên áp dụng</label>
            <select id="extStudentSelect" class="form-input" style="width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:13.5px;background:var(--surface);color:var(--text);"></select>
          </div>

          <div>
            <label class="input-label" style="font-size:12.5px;font-weight:700;display:block;margin-bottom:5px;">Tên môn học / Khóa học <span style="color:#ef4444">*</span></label>
            <input type="text" id="extSubjectName" required placeholder="VD: Lớp TOEIC 650+, Tiếng Nhật N3, Thực tập..." class="form-input" style="width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:13.5px;background:var(--surface);color:var(--text);box-sizing:border-box;">
          </div>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div>
              <label class="input-label" style="font-size:12.5px;font-weight:700;display:block;margin-bottom:5px;">Địa điểm / Phòng học</label>
              <input type="text" id="extRoomName" placeholder="VD: Cơ sở 2, Trung tâm X, Online Zoom..." class="form-input" style="width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:13.5px;background:var(--surface);color:var(--text);box-sizing:border-box;">
            </div>
            <div>
              <label class="input-label" style="font-size:12.5px;font-weight:700;display:block;margin-bottom:5px;">Giáo viên / Đơn vị dạy</label>
              <input type="text" id="extTeacherName" placeholder="VD: Thầy John, Cô Hoa..." class="form-input" style="width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:13.5px;background:var(--surface);color:var(--text);box-sizing:border-box;">
            </div>
          </div>

          <div style="background:var(--surface-2);padding:12px 14px;border-radius:10px;border:1px solid var(--border);">
            <div style="font-size:12.5px;font-weight:700;margin-bottom:8px;color:var(--text);">Khoảng ngày diễn ra khóa học <span style="color:#ef4444">*</span></div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
              <div>
                <label style="font-size:11.5px;color:var(--muted);display:block;margin-bottom:4px;">Từ ngày</label>
                <input type="date" id="extStartDate" required style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:var(--surface);color:var(--text);box-sizing:border-box;">
              </div>
              <div>
                <label style="font-size:11.5px;color:var(--muted);display:block;margin-bottom:4px;">Đến ngày</label>
                <input type="date" id="extEndDate" required style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:var(--surface);color:var(--text);box-sizing:border-box;">
              </div>
            </div>
          </div>

          <div>
            <label class="input-label" style="font-size:12.5px;font-weight:700;display:block;margin-bottom:6px;">Lặp lại vào các Thứ trong tuần <span style="color:#ef4444">*</span></label>
            <div style="display:flex;gap:6px;flex-wrap:wrap;" id="extDaysOfWeekGroup">
              <label class="day-checkbox-label" style="display:inline-flex;align-items:center;gap:4px;padding:6px 10px;background:var(--surface);border:1px solid var(--border);border-radius:6px;font-size:12.5px;cursor:pointer;">
                <input type="checkbox" name="extDays" value="2"> T2
              </label>
              <label class="day-checkbox-label" style="display:inline-flex;align-items:center;gap:4px;padding:6px 10px;background:var(--surface);border:1px solid var(--border);border-radius:6px;font-size:12.5px;cursor:pointer;">
                <input type="checkbox" name="extDays" value="3"> T3
              </label>
              <label class="day-checkbox-label" style="display:inline-flex;align-items:center;gap:4px;padding:6px 10px;background:var(--surface);border:1px solid var(--border);border-radius:6px;font-size:12.5px;cursor:pointer;">
                <input type="checkbox" name="extDays" value="4"> T4
              </label>
              <label class="day-checkbox-label" style="display:inline-flex;align-items:center;gap:4px;padding:6px 10px;background:var(--surface);border:1px solid var(--border);border-radius:6px;font-size:12.5px;cursor:pointer;">
                <input type="checkbox" name="extDays" value="5"> T5
              </label>
              <label class="day-checkbox-label" style="display:inline-flex;align-items:center;gap:4px;padding:6px 10px;background:var(--surface);border:1px solid var(--border);border-radius:6px;font-size:12.5px;cursor:pointer;">
                <input type="checkbox" name="extDays" value="6"> T6
              </label>
              <label class="day-checkbox-label" style="display:inline-flex;align-items:center;gap:4px;padding:6px 10px;background:var(--surface);border:1px solid var(--border);border-radius:6px;font-size:12.5px;cursor:pointer;">
                <input type="checkbox" name="extDays" value="7"> T7
              </label>
              <label class="day-checkbox-label" style="display:inline-flex;align-items:center;gap:4px;padding:6px 10px;background:var(--surface);border:1px solid var(--border);border-radius:6px;font-size:12.5px;cursor:pointer;">
                <input type="checkbox" name="extDays" value="8"> CN
              </label>
            </div>
          </div>

          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;">
            <div>
              <label class="input-label" style="font-size:12px;font-weight:700;display:block;margin-bottom:4px;">Giờ bắt đầu <span style="color:#ef4444">*</span></label>
              <input type="time" id="extStartTime" required value="18:00" style="width:100%;padding:8px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:var(--surface);color:var(--text);box-sizing:border-box;">
            </div>
            <div>
              <label class="input-label" style="font-size:12px;font-weight:700;display:block;margin-bottom:4px;">Giờ kết thúc <span style="color:#ef4444">*</span></label>
              <input type="time" id="extEndTime" required value="20:30" style="width:100%;padding:8px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:var(--surface);color:var(--text);box-sizing:border-box;">
            </div>
            <div>
              <label class="input-label" style="font-size:12px;font-weight:700;display:block;margin-bottom:4px;">Buổi</label>
              <select id="extBuoi" style="width:100%;padding:8px 6px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:var(--surface);color:var(--text);box-sizing:border-box;">
                <option value="1">Sáng</option>
                <option value="2">Chiều</option>
                <option value="3" selected>Tối</option>
              </select>
            </div>
          </div>

          <div>
            <label class="input-label" style="font-size:12.5px;font-weight:700;display:block;margin-bottom:4px;">Ghi chú thêm</label>
            <input type="text" id="extNote" placeholder="Ghi chú về học phí, tài liệu, link học..." class="form-input" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--surface);color:var(--text);box-sizing:border-box;">
          </div>

          <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:10px;border-top:1px solid var(--border);padding-top:14px;">
            <button type="button" id="btnCancelModalExt" class="btn-action" style="padding:8px 16px;">Hủy bỏ</button>
            <button type="submit" id="btnSubmitModalExt" class="btn-action btn-action-primary" style="padding:8px 20px;font-weight:700;background:#4f46e5;color:#fff;border-color:transparent;">💾 Lưu lịch ngoài</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="js/lichhoc.js"></script>
</body>
</html>
