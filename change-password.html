<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đổi Mật Khẩu — LH-NaviX</title>
  <meta name="theme-color" content="#f5f6f8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/index.css">
  <style>
    .modalBg-static {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
      display: flex; justify-content: center; align-items: center; z-index: 999;
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  
  <div class="modalBg-static" id="modalBg">
    <div class="card modal" style="transform: translateY(0); opacity: 1;">
      <div class="modal-icon" style="color: var(--accent); background: #eef2ff;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <rect x="3" y="11" width="18" height="11" rx="2" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>
      </div>
      <h2>Đổi mật khẩu</h2>
      <p>Cập nhật mật khẩu mới cho tài khoản của bạn.</p>
      
      <input type="password" id="oldPwd" placeholder="Mật khẩu hiện tại" autocomplete="current-password">
      <input type="password" id="newPwd" placeholder="Mật khẩu mới (tối thiểu 6 ký tự)" autocomplete="new-password">
      <input type="password" id="confirmPwd" placeholder="Xác nhận mật khẩu mới" autocomplete="new-password">
      
      <div id="errBox" role="alert"></div>
      
      <div class="modal-actions" style="flex-direction: column;">
        <button type="button" class="btn-ok" id="btnChangePwd" onclick="submitChangePassword()" style="margin:0; width: 100%;">Đổi mật khẩu</button>
        <button type="button" onclick="goBack()" style="margin:0; width: 100%; border:none; background:transparent; color:var(--muted); margin-top:5px; box-shadow:none; cursor:pointer;">Quay lại</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=6"></script>
  <script>
    async function initCheck() {
      const { data } = await supabase.auth.getSession();
      if (!data?.session) {
        location.href = 'index.html';
      }
    }
    
    async function goBack() {
      const { data: isAdm } = await supabase.rpc('is_admin');
      location.href = isAdm ? 'admin.html' : 'checkin.html';
    }

    async function submitChangePassword() {
      const oldPwd = document.getElementById('oldPwd').value || '';
      const newPwd = document.getElementById('newPwd').value || '';
      const confirmPwd = document.getElementById('confirmPwd').value || '';
      const err = document.getElementById('errBox');
      const btn = document.getElementById('btnChangePwd');

      err.innerText = '';

      if (!oldPwd || !newPwd || !confirmPwd) {
        err.innerText = 'Vui lòng nhập đầy đủ các trường.';
        return;
      }

      if (newPwd.length < 6) {
        err.innerText = 'Mật khẩu mới phải có ít nhất 6 ký tự.';
        return;
      }

      if (newPwd !== confirmPwd) {
        err.innerText = 'Xác nhận mật khẩu không khớp.';
        return;
      }

      btn.disabled = true;
      btn.innerText = 'Đang xử lý...';

      try {
        const { data: sessionData } = await supabase.auth.getSession();
        if (!sessionData?.session) throw new Error("Chưa đăng nhập");

        const { error: updateErr } = await supabase.auth.updateUser({
          password: newPwd,
          current_password: oldPwd
        });

        if (updateErr) {
          err.innerText = (updateErr.message.toLowerCase().includes('current password') || updateErr.message.toLowerCase().includes('match')) 
            ? 'Mật khẩu hiện tại không đúng.' 
            : 'Lỗi cập nhật mật khẩu: ' + updateErr.message;
          btn.disabled = false;
          btn.innerText = 'Đổi mật khẩu';
          return;
        }

        btn.innerText = 'Thành công!';
        
        setTimeout(async () => {
          await goBack();
        }, 1000);

      } catch (error) {
        err.innerText = 'Đã xảy ra lỗi: ' + error.message;
        btn.disabled = false;
        btn.innerText = 'Đổi mật khẩu';
      }
    }

    document.addEventListener('DOMContentLoaded', initCheck);
  </script>
</body>
</html>
