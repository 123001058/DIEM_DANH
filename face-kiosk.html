<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LH-NaviX — Kiosk Điểm Danh Khuôn Mặt AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">

<!-- Load Supabase & Face-API -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js?v=6"></script>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

<style>
:root {
  --primary-glow: rgba(37, 99, 235, 0.4);
  --success-glow: rgba(34, 197, 94, 0.45);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 0;
  background: #0b0f19;
  color: #f1f5f9;
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
.kiosk-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 24px;
  background: rgba(15, 23, 42, 0.9);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}
.kiosk-brand {
  display: flex;
  align-items: center;
  gap: 12px;
}
.kiosk-logo-badge {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  background: linear-gradient(135deg, #2563eb, #38bdf8);
  display: grid;
  place-items: center;
  font-size: 22px;
  box-shadow: 0 4px 14px var(--primary-glow);
}
.kiosk-title {
  font-size: 16px;
  font-weight: 800;
  color: #fff;
}
.kiosk-subtitle {
  font-size: 11px;
  color: #94a3b8;
}
.kiosk-status-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 12.5px;
  font-weight: 700;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.1);
}
.status-pill {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #94a3b8;
}
.status-pill.online {
  background: #22c55e;
  box-shadow: 0 0 10px #22c55e;
  animation: pulse-dot 2s infinite;
}
.status-pill.offline {
  background: #ef4444;
}
@keyframes pulse-dot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(1.2); }
}

/* MAIN LAYOUT */
.kiosk-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.4fr) minmax(380px, 440px);
  gap: 20px;
  padding: 20px 24px;
  flex: 1;
  max-width: 1600px;
  margin: 0 auto;
  width: 100%;
}

/* CAMERA STAGE */
.camera-card {
  background: #111827;
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
}
.camera-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 18px;
  background: rgba(17, 24, 39, 0.95);
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  flex-wrap: wrap;
  gap: 10px;
}
.toolbar-group {
  display: flex;
  align-items: center;
  gap: 8px;
}
.btn-toggle {
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
  border: 1px solid rgba(255, 255, 255, 0.12);
  background: rgba(255, 255, 255, 0.04);
  color: #cbd5e1;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-toggle.active {
  background: #2563eb;
  color: #fff;
  border-color: #3b82f6;
  box-shadow: 0 2px 8px var(--primary-glow);
}
.input-ip {
  background: #1e293b;
  border: 1px solid rgba(255, 255, 255, 0.12);
  color: #fff;
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 12px;
  width: 150px;
}

.video-container {
  position: relative;
  background: #030712;
  flex: 1;
  min-height: 480px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
#webcamVideo {
  width: 100%;
  height: 100%;
  object-fit: contain;
  transform: scaleX(-1);
}
#espStreamCanvas {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: none;
}
#overlayCanvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.camera-hud {
  position: absolute;
  bottom: 14px;
  left: 14px;
  right: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  pointer-events: none;
}
.hud-pill {
  background: rgba(15, 23, 42, 0.88);
  backdrop-filter: blur(8px);
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 700;
  color: #e2e8f0;
  border: 1px solid rgba(255, 255, 255, 0.12);
}

/* SIDE PANEL */
.side-card {
  background: #111827;
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.side-tabs {
  display: flex;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  background: rgba(17, 24, 39, 0.6);
}
.side-tab-btn {
  flex: 1;
  padding: 13px;
  text-align: center;
  font-size: 13px;
  font-weight: 700;
  color: #94a3b8;
  background: transparent;
  border: none;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
}
.side-tab-btn.active {
  color: #60a5fa;
  border-bottom-color: #3b82f6;
  background: rgba(59, 130, 246, 0.08);
}

.tab-pane {
  display: none;
  padding: 18px;
  flex: 1;
  overflow-y: auto;
}
.tab-pane.active {
  display: flex;
  flex-direction: column;
}

/* MATCH POPUP CARD */
.match-card {
  padding: 16px;
  background: linear-gradient(135deg, rgba(34, 197, 94, 0.15), rgba(16, 185, 129, 0.08));
  border: 1px solid rgba(34, 197, 94, 0.4);
  border-radius: 14px;
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 16px;
  box-shadow: 0 6px 20px var(--success-glow);
  animation: pop-in 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes pop-in {
  from { opacity: 0; transform: scale(0.92); }
  to { opacity: 1; transform: scale(1); }
}
.match-avatar-img {
  width: 58px;
  height: 58px;
  border-radius: 14px;
  object-fit: cover;
  border: 2px solid #22c55e;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
  flex-shrink: 0;
}
.match-info b {
  font-size: 16px;
  color: #fff;
  display: block;
}
.match-info span {
  font-size: 12px;
  color: #86efac;
  display: block;
  margin-top: 2px;
}
.match-badge {
  display: inline-block;
  margin-top: 4px;
  padding: 2px 8px;
  border-radius: 6px;
  background: #22c55e;
  color: #052e16;
  font-size: 11px;
  font-weight: 800;
}

.history-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex: 1;
  overflow-y: auto;
}
.history-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 10px;
}
.history-item-left {
  display: flex;
  align-items: center;
  gap: 10px;
}
.history-avatar {
  width: 34px;
  height: 34px;
  border-radius: 8px;
  object-fit: cover;
  background: #1e293b;
}
.history-name {
  font-size: 13px;
  font-weight: 700;
  color: #f8fafc;
}
.history-mssv {
  font-size: 11px;
  color: #94a3b8;
}
.history-time {
  font-size: 12px;
  color: #22c55e;
  font-weight: 700;
}

/* ENROLL FORM */
.enroll-box {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.student-preview-card {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
}
.preview-avatar {
  width: 60px;
  height: 60px;
  border-radius: 10px;
  object-fit: cover;
  background: #1e293b;
  border: 1px solid rgba(255, 255, 255, 0.1);
}
.form-label {
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: #94a3b8;
  margin-bottom: 4px;
}
.form-input, .form-select {
  width: 100%;
  padding: 10px 12px;
  background: #1e293b;
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 8px;
  color: #fff;
  font-family: inherit;
  font-size: 13px;
}
.btn-action {
  padding: 11px 16px;
  border-radius: 9px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 800;
  border: none;
  cursor: pointer;
  transition: all 0.18s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-primary { background: #2563eb; color: #fff; }
.btn-primary:hover:not(:disabled) { background: #1d4ed8; box-shadow: 0 4px 14px var(--primary-glow); }
.btn-success { background: #10b981; color: #fff; }
.btn-success:hover:not(:disabled) { background: #059669; }

.db-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 10px;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.02);
  margin-bottom: 6px;
}
.btn-del {
  background: transparent;
  border: none;
  color: #f87171;
  cursor: pointer;
  padding: 4px 8px;
  font-size: 12px;
}

@media (max-width: 900px) {
  .kiosk-grid { grid-template-columns: 1fr; }
  .video-container { min-height: 320px; }
}
</style>
</head>
<body>

<!-- TOP NAV -->
<header class="kiosk-nav">
  <div class="kiosk-brand">
    <div class="kiosk-logo-badge">📷</div>
    <div>
      <div class="kiosk-title">LH-NaviX · Kiosk Khuôn Mặt AI</div>
      <div class="kiosk-subtitle">Nhận diện khuôn mặt & Tự động điểm danh</div>
    </div>
  </div>

  <div style="display:flex;align-items:center;gap:12px;">
    <div class="kiosk-status-badge" id="sessionBadge">
      <span class="status-pill" id="sessionPill"></span>
      <span id="sessionText">Đang tìm phiên...</span>
    </div>
    <button type="button" id="btnQuickOpen" onclick="quickOpenSession()" style="display:none;background:#22c55e;color:#052e16;border:none;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:800;cursor:pointer;">+ Mở phiên ngay</button>
    <a href="admin.html" style="color:#94a3b8;text-decoration:none;font-size:12px;font-weight:700;padding:6px 12px;border:1px solid rgba(255,255,255,0.1);border-radius:8px;">← Về Admin</a>
  </div>
</header>

<!-- MAIN CONTENT -->
<main class="kiosk-grid">

  <!-- LEFT: CAMERA STAGE -->
  <section class="camera-card">
    <div class="camera-toolbar">
      <div class="toolbar-group">
        <span style="font-size:12px;font-weight:700;color:#94a3b8;">Camera:</span>
        <button type="button" class="btn-toggle active" id="btnModeWebcam" onclick="switchCameraMode('webcam')">💻 Webcam máy tính</button>
        <button type="button" class="btn-toggle" id="btnModeEsp" onclick="switchCameraMode('esp')">📡 ESP32-S3 Cam</button>
      </div>

      <div class="toolbar-group" id="espConfigGroup" style="display:none;">
        <input type="text" class="input-ip" id="espIpInput" placeholder="IP ESP32" value="192.168.2.168">
        <button type="button" class="btn-toggle active" onclick="connectEspCamera()">Kết nối</button>
        <button type="button" class="btn-toggle" onclick="toggleEspFlip()" title="Lật ảnh nếu bị ngược">🔄 Xoay/Lật</button>
      </div>

      <div class="toolbar-group">
        <button type="button" class="btn-toggle" onclick="toggleFullscreen()">⛶ Fullscreen</button>
      </div>
    </div>

    <div class="video-container" id="videoBox">
      <!-- WEBCAM VIDEO -->
      <video id="webcamVideo" autoplay muted playsinline></video>
      <!-- ESP32 NATIVE STREAM (MƯỢT 30-60 FPS) -->
      <img id="espStreamImg" crossorigin="anonymous" alt="ESP32 Stream">
      <!-- DRAWING CANVAS (BBOX & LABELS) -->
      <canvas id="overlayCanvas"></canvas>

      <div class="camera-hud">
        <div class="hud-pill" id="hudStatus">⏳ Đang khởi động mô hình AI...</div>
        <div class="hud-pill" id="hudCount">Đã học: <b id="enrolledCount">0</b> bạn</div>
      </div>
    </div>
  </section>

  <!-- RIGHT: SIDEBAR (RECENT & ENROLL) -->
  <aside class="side-card">
    <nav class="side-tabs">
      <button type="button" class="side-tab-btn active" id="tabBtnRecent" onclick="switchTab('recent')">🟢 Vừa điểm danh</button>
      <button type="button" class="side-tab-btn" id="tabBtnEnroll" onclick="switchTab('enroll')">➕ Đăng ký khuôn mặt</button>
    </nav>

    <!-- TAB 1: RECENT CHECK-INS -->
    <div class="tab-pane active" id="tabRecent">
      <div id="latestMatchCard" style="display:none;">
        <div class="match-card">
          <img class="match-avatar-img" id="matchAvatar" src="images/logo.png" alt="Avatar">
          <div class="match-info">
            <b id="matchName">—</b>
            <span id="matchDetail">—</span>
            <div class="match-badge">✓ Đã điểm danh thành công</div>
          </div>
        </div>
      </div>

      <div style="font-size:11px;font-weight:800;text-transform:uppercase;color:#94a3b8;margin-bottom:8px;">Lịch sử nhận diện gần nhất:</div>
      <div class="history-list" id="historyList">
        <div style="color:#64748b;font-size:13px;text-align:center;padding:40px 0;">Chưa có lượt điểm danh nào</div>
      </div>
    </div>

    <!-- TAB 2: ENROLL FACES -->
    <div class="tab-pane" id="tabEnroll">
      <div class="enroll-box">
        <div>
          <label class="form-label">Chọn sinh viên từ danh sách đội:</label>
          <select class="form-select" id="studentSelect" onchange="onStudentSelectChange()">
            <option value="">-- Đang tải danh sách... --</option>
          </select>
        </div>

        <div class="student-preview-card" id="studentPreviewCard" style="display:none;">
          <img class="preview-avatar" id="previewAvatar" src="" alt="Avatar">
          <div style="min-width:0;flex:1;">
            <b style="font-size:14px;color:#fff;" id="previewName">—</b>
            <div style="font-size:12px;color:#94a3b8;" id="previewMssv">—</div>
            <div style="font-size:11px;color:#38bdf8;" id="previewClass">—</div>
          </div>
        </div>

        <!-- AUTO ENROLL BUTTON FROM PHOTO -->
        <button type="button" class="btn-action btn-success" id="btnAutoEnrollPhoto" onclick="enrollFromDocumentPhoto()" style="display:none;">
          ⚡ Nạp khuôn mặt từ ảnh thẻ có sẵn
        </button>

        <button type="button" class="btn-action" style="background:rgba(59,130,246,0.15);color:#60a5fa;border:1px solid rgba(59,130,246,0.3);" onclick="enrollAll30Students()">
          📦 Tự động nạp khuôn mặt cả 30 bạn từ tài liệu
        </button>

        <div style="border-top:1px dashed rgba(255,255,255,0.1);padding-top:10px;">
          <label class="form-label">Hoặc chụp trực tiếp từ camera:</label>
          <button type="button" class="btn-action btn-primary" id="btnCaptureSample" onclick="captureFaceSample()">
            📸 Chụp mẫu từ Camera (<span id="sampleCount">0</span>/3)
          </button>
        </div>

        <button type="button" class="btn-action" style="background:#10b981;color:#fff;" id="btnSaveEnroll" onclick="saveEnrolledFace()" disabled>
          💾 Lưu khuôn mặt đã chụp
        </button>

        <div class="db-list">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <span class="form-label">Đã nạp (<span id="dbTotal">0</span> người)</span>
            <button type="button" class="btn-del" onclick="exportFaceDb()">Xuất JSON</button>
          </div>
          <div id="enrolledList" style="max-height:180px;overflow-y:auto;"></div>
        </div>
      </div>
    </div>

  </aside>

</main>

<script>
// ==========================================
// STATE & CONFIG
// ==========================================
let cameraMode = 'webcam';
let isModelLoaded = false;
let isDetecting = false;
let currentSession = null;
let labeledDescriptors = [];
let faceMatcher = null;
let studentsList = [];
let localMapping = [];
let recentCheckins = [];
let lastCheckinTime = {};
let tempSamples = [];

let espInterval = null;
let espImgObj = new Image();

const webcamVideo = document.getElementById('webcamVideo');
const espCanvas = document.getElementById('espStreamCanvas');
const overlayCanvas = document.getElementById('overlayCanvas');
const hudStatus = document.getElementById('hudStatus');

// ==========================================
// 1. KHỞI TẠO HỆ THỐNG
// ==========================================
window.addEventListener('DOMContentLoaded', async () => {
  await loadStudentsMapping();
  loadEnrolledFromStorage();
  await loadFaceModels();
  await checkActiveSession();
  setInterval(checkActiveSession, 8000);
  await startWebcam();
  
  // Tự động chọn 123001058 (Nguyễn Khánh Hoà) sẵn để user test luôn
  setTimeout(() => {
    const sel = document.getElementById('studentSelect');
    if (sel && sel.querySelector('option[value="123001058"]')) {
      sel.value = '123001058';
      onStudentSelectChange();
    }
  }, 1000);
});

// Load mapping extracted from docx
async function loadStudentsMapping() {
  try {
    const res = await fetch('images/faces/students_mapping.json');
    if (res.ok) {
      localMapping = await res.json();
    }
  } catch(e) {
    console.warn('Chưa có students_mapping.json:', e);
  }

  // Load from Supabase
  try {
    const { data } = await window.supabase.from('students').select('*').order('name');
    studentsList = data || [];
    
    // Ghép thông tin avatar nếu có
    if (localMapping.length > 0) {
      localMapping.forEach(m => {
        const found = studentsList.find(s => s.mssv === m.mssv);
        if (found) {
          found.avatar = m.avatar || `images/faces/${m.mssv}.jpg`;
          found.class = m.class || '';
          found.phone = m.phone || '';
        } else {
          studentsList.push({
            mssv: m.mssv,
            name: m.name,
            class: m.class || '',
            phone: m.phone || '',
            avatar: m.avatar || `images/faces/${m.mssv}.jpg`
          });
        }
      });
    }

    renderStudentSelect();
  } catch (e) {
    console.error('Lỗi load sinh viên:', e);
  }
}

function renderStudentSelect() {
  const sel = document.getElementById('studentSelect');
  sel.innerHTML = '<option value="">-- Chọn sinh viên --</option>';
  studentsList.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.mssv;
    opt.textContent = `${s.name} (${s.mssv})`;
    sel.appendChild(opt);
  });
}

function onStudentSelectChange() {
  const mssv = document.getElementById('studentSelect').value;
  const card = document.getElementById('studentPreviewCard');
  const btnAuto = document.getElementById('btnAutoEnrollPhoto');
  if (!mssv) {
    card.style.display = 'none';
    btnAuto.style.display = 'none';
    return;
  }
  const st = studentsList.find(s => s.mssv === mssv);
  if (st) {
    card.style.display = 'flex';
    document.getElementById('previewName').textContent = st.name;
    document.getElementById('previewMssv').textContent = `MSSV: ${st.mssv}`;
    document.getElementById('previewClass').textContent = st.class ? `Lớp: ${st.class}` : '';
    
    const avatarUrl = st.avatar || `images/faces/${st.mssv}.jpg`;
    document.getElementById('previewAvatar').src = avatarUrl;
    btnAuto.style.display = 'flex';
    btnAuto.textContent = `⚡ Nạp khuôn mặt ${st.name} từ ảnh thẻ`;
    resetSampleCollector();
  }
}

// Kiểm tra phiên điểm danh Supabase
async function checkActiveSession() {
  try {
    const { data } = await window.supabase
      .from('sessions')
      .select('*')
      .eq('is_open', true)
      .order('started_at', { ascending: false })
      .limit(1)
      .maybeSingle();

    const pill = document.getElementById('sessionPill');
    const txt = document.getElementById('sessionText');
    const btnQuick = document.getElementById('btnQuickOpen');

    if (data) {
      currentSession = data;
      pill.className = 'status-pill online';
      txt.textContent = `Phiên mở: ${data.session_name}`;
      btnQuick.style.display = 'none';
    } else {
      currentSession = null;
      pill.className = 'status-pill offline';
      txt.textContent = 'Chưa có phiên nào mở';
      btnQuick.style.display = 'inline-block';
    }
  } catch (e) {}
}

async function quickOpenSession() {
  const name = prompt('Nhập tên phiên điểm danh nhanh:', 'Phiên Kiosk AI ' + new Date().toLocaleTimeString('vi-VN'));
  if (!name) return;
  try {
    const { data, error } = await window.supabase.from('sessions').insert({
      session_name: name,
      is_open: true,
      started_at: new Date().toISOString(),
      duration_min: 60,
      qr_token: 'kiosk_face_' + Date.now()
    }).select().single();
    if (!error) {
      alert('Đã mở phiên thành công!');
      await checkActiveSession();
    } else {
      alert('Lỗi mở phiên: ' + error.message);
    }
  } catch(e) {
    alert(e.message);
  }
}

// ==========================================
// 2. LOAD FACE-API MODELS
// ==========================================
async function loadFaceModels() {
  hudStatus.textContent = '⏳ Đang tải mô hình AI...';
  const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
  try {
    await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
    await faceapi.nets.faceLandmark68TinyNet.loadFromUri(MODEL_URL);
    await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
    isModelLoaded = true;
    hudStatus.textContent = '🟢 AI sẵn sàng — Nhìn vào camera để điểm danh';
    updateFaceMatcher();
    startDetectionLoop();
  } catch (err) {
    console.error('Lỗi tải model:', err);
    hudStatus.textContent = '❌ Lỗi tải AI models. Kiểm tra mạng internet.';
  }
}

// ==========================================
// 3. NGUỒN CAMERA (WEBCAM / ESP32-S3)
// ==========================================
async function startWebcam() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' }
    });
    webcamVideo.srcObject = stream;
    webcamVideo.style.display = 'block';
    espCanvas.style.display = 'none';
    if (espInterval) { clearInterval(espInterval); espInterval = null; }
  } catch (e) {
    console.warn('Webcam error:', e);
    hudStatus.textContent = '⚠️ Chưa mở được webcam máy tính.';
  }
}

function stopWebcam() {
  if (webcamVideo.srcObject) {
    webcamVideo.srcObject.getTracks().forEach(t => t.stop());
    webcamVideo.srcObject = null;
  }
}

function switchCameraMode(mode) {
  cameraMode = mode;
  document.getElementById('btnModeWebcam').classList.toggle('active', mode === 'webcam');
  document.getElementById('btnModeEsp').classList.toggle('active', mode === 'esp');
  document.getElementById('espConfigGroup').style.display = (mode === 'esp') ? 'flex' : 'none';

  if (mode === 'webcam') {
    startWebcam();
  } else {
    stopWebcam();
    connectEspCamera();
  }
}

let espRotation = 0; // 0, 90, 180, 270

function toggleEspFlip() {
  espRotation = (espRotation + 180) % 360;
  espImg.style.transform = `rotate(${espRotation}deg)`;
}

function connectEspCamera() {
  const ip = document.getElementById('espIpInput').value.trim();
  if (!ip) return;

  webcamVideo.style.display = 'none';
  espImg.style.display = 'block';
  espImg.src = `http://${ip}:81/stream`;

  hudStatus.textContent = `📡 Đang xem luồng Stream mượt từ ESP32: ${ip}`;
}

// ==========================================
// 4. VÒNG LẶP NHẬN DIỆN KHUÔN MẶT
// ==========================================
async function startDetectionLoop() {
  if (isDetecting) return;
  isDetecting = true;

  const loop = async () => {
    if (!isModelLoaded) {
      requestAnimationFrame(loop);
      return;
    }

    const inputMedia = (cameraMode === 'webcam') ? webcamVideo : espImg;
    const isReady = (cameraMode === 'webcam') 
      ? (webcamVideo.readyState === 4)
      : (espImg.complete && espImg.naturalWidth > 0);

    if (isReady) {
      const displaySize = {
        width: inputMedia.clientWidth || 640,
        height: inputMedia.clientHeight || 480
      };
      if (overlayCanvas.width !== displaySize.width || overlayCanvas.height !== displaySize.height) {
        overlayCanvas.width = displaySize.width;
        overlayCanvas.height = displaySize.height;
      }

      const detections = await faceapi
        .detectAllFaces(inputMedia, new faceapi.TinyFaceDetectorOptions({ inputSize: 256, scoreThreshold: 0.5 }))
        .withFaceLandmarks(true)
        .withFaceDescriptors();

      const resizedDetections = faceapi.resizeResults(detections, displaySize);
      const ctx = overlayCanvas.getContext('2d');
      ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

      if (resizedDetections.length > 0) {
        resizedDetections.forEach(detection => {
          let { box } = detection.detection;
          
          // Lật tọa độ X nếu đang soi webcam (vì webcam bị scaleX(-1))
          let drawX = box.x;
          if (cameraMode === 'webcam') {
            drawX = displaySize.width - box.x - box.width;
          }

          let label = 'Người lạ / Chưa học';
          let isMatch = false;
          let confidence = '';

          if (faceMatcher) {
            const bestMatch = faceMatcher.findBestMatch(detection.descriptor);
            if (bestMatch.label !== 'unknown') {
              label = bestMatch.label;
              isMatch = true;
              confidence = ` (${Math.round((1 - bestMatch.distance) * 100)}%)`;
              triggerCheckin(label);
            }
          }

          // Vẽ khung nhận diện
          ctx.lineWidth = 3;
          ctx.strokeStyle = isMatch ? '#22c55e' : '#38bdf8';
          ctx.strokeRect(drawX, box.y, box.width, box.height);

          // Vẽ góc bo tròn hiện đại
          const radius = 8;
          ctx.fillStyle = isMatch ? 'rgba(34, 197, 94, 0.9)' : 'rgba(56, 189, 248, 0.9)';
          const text = (isMatch ? `✓ ` : ``) + label + confidence;
          ctx.font = 'bold 12.5px Plus Jakarta Sans, sans-serif';
          const textWidth = ctx.measureText(text).width;
          
          const labelY = box.y > 26 ? box.y - 26 : box.y;
          ctx.fillRect(drawX, labelY, textWidth + 16, 24);

          ctx.fillStyle = '#ffffff';
          ctx.fillText(text, drawX + 8, labelY + 16);
        });
      }
    }

    setTimeout(() => { requestAnimationFrame(loop); }, 120);
  };

  requestAnimationFrame(loop);
}

// ==========================================
// 5. ĐIỂM DANH & GỌI SUPABASE
// ==========================================
async function triggerCheckin(label) {
  const mssv = label.split(' - ')[0]?.trim();
  const name = label.split(' - ')[1]?.trim() || mssv;

  const now = Date.now();
  if (lastCheckinTime[mssv] && (now - lastCheckinTime[mssv] < 15000)) {
    return;
  }
  lastCheckinTime[mssv] = now;

  // Hiển thị Popup & Âm thanh
  showMatchPopup(name, mssv);
  speakGreeting(name);
  playChime();

  if (!currentSession) {
    console.warn('Nhận diện được nhưng không có phiên mở.');
    return;
  }

  try {
    // 1. Thử RPC
    const { data: rpcRes, error: rpcErr } = await window.supabase.rpc('kiosk_face_checkin', {
      p_mssv: mssv,
      p_session_id: String(currentSession.id)
    });

    if (!rpcErr && rpcRes?.ok) {
      console.log('Điểm danh RPC thành công:', rpcRes);
    } else {
      // 2. Ghi trực tiếp bảng attendance
      await window.supabase.from('attendance').upsert({
        session_id: currentSession.id,
        mssv: mssv,
        full_name: name,
        status: 'có mặt',
        category: 'Khuôn mặt',
        note: 'Kiosk Face AI'
      }, { onConflict: 'session_id,mssv' });
    }
  } catch (err) {
    console.error('Lỗi gửi điểm danh:', err);
  }
}

function showMatchPopup(name, mssv) {
  const card = document.getElementById('latestMatchCard');
  document.getElementById('matchName').textContent = name;
  document.getElementById('matchDetail').textContent = `MSSV: ${mssv} · ${new Date().toLocaleTimeString('vi-VN')}`;
  
  const st = studentsList.find(s => s.mssv === mssv);
  document.getElementById('matchAvatar').src = st?.avatar || `images/faces/${mssv}.jpg`;

  card.style.display = 'block';

  recentCheckins.unshift({
    name, mssv,
    avatar: st?.avatar || `images/faces/${mssv}.jpg`,
    time: new Date().toLocaleTimeString('vi-VN', { hour:'2-digit', minute:'2-digit', second:'2-digit' })
  });
  renderHistory();
}

function renderHistory() {
  const container = document.getElementById('historyList');
  if (recentCheckins.length === 0) {
    container.innerHTML = '<div style="color:#64748b;font-size:13px;text-align:center;padding:40px 0;">Chưa có lượt điểm danh nào</div>';
    return;
  }
  container.innerHTML = recentCheckins.slice(0, 15).map(item => `
    <div class="history-item">
      <div class="history-item-left">
        <img class="history-avatar" src="${item.avatar}" onerror="this.src='images/logo.png'">
        <div>
          <div class="history-name">${escapeHtml(item.name)}</div>
          <div class="history-mssv">${escapeHtml(item.mssv)}</div>
        </div>
      </div>
      <div class="history-time">${item.time}</div>
    </div>
  `).join('');
}

function speakGreeting(name) {
  try {
    if ('speechSynthesis' in window) {
      const u = new SpeechSynthesisUtterance(`Xin chào ${name}, điểm danh thành công!`);
      u.lang = 'vi-VN';
      u.rate = 1.05;
      window.speechSynthesis.speak(u);
    }
  } catch(e) {}
}

function playChime() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(587.33, ctx.currentTime);
    osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
    osc.start();
    osc.stop(ctx.currentTime + 0.35);
  } catch (e) {}
}

// ==========================================
// 6. TỰ ĐỘNG NẠP MẶT TỪ ẢNH THẺ CÓ SẴN
// ==========================================
async function enrollFromDocumentPhoto() {
  const mssv = document.getElementById('studentSelect').value;
  if (!mssv) return alert('Vui lòng chọn sinh viên!');

  const st = studentsList.find(s => s.mssv === mssv);
  if (!st) return;

  const avatarUrl = st.avatar || `images/faces/${st.mssv}.jpg`;
  hudStatus.textContent = `⏳ Đang quét và học khuôn mặt từ ảnh của ${st.name}...`;

  try {
    const img = await faceapi.fetchImage(avatarUrl);
    const detection = await faceapi
      .detectSingleFace(img, new faceapi.TinyFaceDetectorOptions({ scoreThreshold: 0.4 }))
      .withFaceLandmarks(true)
      .withFaceDescriptor();

    if (!detection) {
      alert(`Không phát hiện được rõ khuôn mặt trong ảnh ${avatarUrl}!`);
      hudStatus.textContent = '⚠️ Không tìm thấy mặt trong ảnh.';
      return;
    }

    const label = `${st.mssv} - ${st.name}`;
    let db = JSON.parse(localStorage.getItem('face_descriptors_db') || '{}');
    // Lưu descriptor
    db[label] = [Array.from(detection.descriptor)];
    localStorage.setItem('face_descriptors_db', JSON.stringify(db));

    alert(`✓ Đã nạp thành công khuôn mặt của ${st.name} (${st.mssv})!`);
    loadEnrolledFromStorage();
    switchTab('recent');
    hudStatus.textContent = `🟢 Đã nạp mặt của ${st.name}. Bạn có thể đứng trước camera test ngay!`;
  } catch (err) {
    alert('Lỗi nạp ảnh: ' + err.message);
  }
}

async function enrollAll30Students() {
  if (!confirm('Bạn có muốn tự động quét và nạp khuôn mặt của cả 30 thành viên từ tài liệu vào hệ thống không?')) return;

  hudStatus.textContent = '⏳ Đang tự động nạp khuôn mặt cả đội...';
  let successCount = 0;
  let db = JSON.parse(localStorage.getItem('face_descriptors_db') || '{}');

  for (const st of studentsList) {
    const avatarUrl = st.avatar || `images/faces/${st.mssv}.jpg`;
    try {
      const img = await faceapi.fetchImage(avatarUrl);
      const detection = await faceapi
        .detectSingleFace(img, new faceapi.TinyFaceDetectorOptions({ scoreThreshold: 0.4 }))
        .withFaceLandmarks(true)
        .withFaceDescriptor();

      if (detection) {
        const label = `${st.mssv} - ${st.name}`;
        db[label] = [Array.from(detection.descriptor)];
        successCount++;
      }
    } catch (e) {}
  }

  localStorage.setItem('face_descriptors_db', JSON.stringify(db));
  loadEnrolledFromStorage();
  alert(`✓ Đã nạp thành công khuôn mặt của ${successCount} sinh viên!`);
  hudStatus.textContent = `🟢 Đã nạp xong ${successCount} sinh viên. Hệ thống sẵn sàng!`;
}

// Chụp trực tiếp từ camera
function resetSampleCollector() {
  tempSamples = [];
  document.getElementById('sampleCount').textContent = '0';
  document.getElementById('btnSaveEnroll').disabled = true;
}

async function captureFaceSample() {
  const mssv = document.getElementById('studentSelect').value;
  const st = studentsList.find(s => s.mssv === mssv);
  if (!st) return alert('Vui lòng chọn sinh viên!');

  const inputMedia = (cameraMode === 'webcam') ? webcamVideo : espCanvas;
  const detection = await faceapi
    .detectSingleFace(inputMedia, new faceapi.TinyFaceDetectorOptions({ scoreThreshold: 0.5 }))
    .withFaceLandmarks(true)
    .withFaceDescriptor();

  if (!detection) {
    alert('Không tìm thấy khuôn mặt rõ ràng! Hãy đứng trước camera và đủ sáng.');
    return;
  }

  tempSamples.push(Array.from(detection.descriptor));
  const count = tempSamples.length;
  document.getElementById('sampleCount').textContent = count;
  playChime();

  if (count >= 3) {
    document.getElementById('btnSaveEnroll').disabled = false;
    alert('Đã đủ 3 mẫu mặt! Bấm nút "Lưu khuôn mặt đã chụp" để hoàn tất.');
  }
}

function saveEnrolledFace() {
  const mssv = document.getElementById('studentSelect').value;
  const st = studentsList.find(s => s.mssv === mssv);
  if (!st || tempSamples.length === 0) return;

  const label = `${st.mssv} - ${st.name}`;
  let db = JSON.parse(localStorage.getItem('face_descriptors_db') || '{}');
  db[label] = tempSamples;
  localStorage.setItem('face_descriptors_db', JSON.stringify(db));

  alert(`✓ Đã lưu khuôn mặt chụp cho ${st.name}!`);
  resetSampleCollector();
  loadEnrolledFromStorage();
  switchTab('recent');
}

function loadEnrolledFromStorage() {
  const db = JSON.parse(localStorage.getItem('face_descriptors_db') || '{}');
  labeledDescriptors = [];

  const listEl = document.getElementById('enrolledList');
  const keys = Object.keys(db);
  document.getElementById('dbTotal').textContent = keys.length;
  document.getElementById('enrolledCount').textContent = keys.length;

  if (keys.length === 0) {
    listEl.innerHTML = '<div style="color:#64748b;font-size:12px;padding:8px 0;">Chưa có khuôn mặt nào được nạp</div>';
  } else {
    listEl.innerHTML = keys.map(label => {
      const mssv = label.split(' - ')[0];
      const avatarUrl = `images/faces/${mssv}.jpg`;
      return `
        <div class="db-item">
          <div style="display:flex;align-items:center;gap:8px;">
            <img src="${avatarUrl}" style="width:26px;height:26px;border-radius:6px;object-fit:cover;" onerror="this.src='images/logo.png'">
            <span style="font-size:12px;font-weight:700;">${escapeHtml(label)} (${db[label].length} mẫu)</span>
          </div>
          <button type="button" class="btn-del" onclick="deleteEnrolledFace('${escapeHtml(label)}')">Xóa</button>
        </div>
      `;
    }).join('');
  }

  keys.forEach(label => {
    const descriptors = db[label].map(arr => new Float32Array(arr));
    labeledDescriptors.push(new faceapi.LabeledFaceDescriptors(label, descriptors));
  });

  updateFaceMatcher();
}

function deleteEnrolledFace(label) {
  if (!confirm(`Xóa khuôn mặt "${label}"?`)) return;
  let db = JSON.parse(localStorage.getItem('face_descriptors_db') || '{}');
  delete db[label];
  localStorage.setItem('face_descriptors_db', JSON.stringify(db));
  loadEnrolledFromStorage();
}

function updateFaceMatcher() {
  faceMatcher = (labeledDescriptors.length > 0) ? new faceapi.FaceMatcher(labeledDescriptors, 0.48) : null;
}

function exportFaceDb() {
  const data = localStorage.getItem('face_descriptors_db') || '{}';
  const blob = new Blob([data], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `face_db_${Date.now()}.json`;
  a.click();
}

// UI TABS
function switchTab(tab) {
  document.getElementById('tabBtnRecent').classList.toggle('active', tab === 'recent');
  document.getElementById('tabBtnEnroll').classList.toggle('active', tab === 'enroll');
  document.getElementById('tabRecent').classList.toggle('active', tab === 'recent');
  document.getElementById('tabEnroll').classList.toggle('active', tab === 'enroll');
}

function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
  else document.exitFullscreen().catch(() => {});
}
