<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LH-NaviX — Camera Điểm Danh Khuôn Mặt AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">

<!-- Load Supabase & Face-API -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js?v=6"></script>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

<style>
:root {
  --primary-glow: rgba(37, 99, 235, 0.4);
  --success-glow: rgba(34, 197, 94, 0.45);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 0;
  background: #0b0f19;
  color: #f1f5f9;
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
.kiosk-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 24px;
  background: rgba(15, 23, 42, 0.9);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}
.kiosk-brand {
  display: flex;
  align-items: center;
  gap: 12px;
}
.kiosk-logo-badge {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  background: linear-gradient(135deg, #2563eb, #38bdf8);
  display: grid;
  place-items: center;
  font-size: 22px;
  box-shadow: 0 4px 14px var(--primary-glow);
}
.kiosk-title {
  font-size: 16px;
  font-weight: 800;
  color: #fff;
}
.kiosk-subtitle {
  font-size: 11px;
  color: #94a3b8;
}
.kiosk-status-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 12.5px;
  font-weight: 700;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.1);
}
.status-pill {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #94a3b8;
}
.status-pill.online {
  background: #22c55e;
  box-shadow: 0 0 10px #22c55e;
  animation: pulse-dot 2s infinite;
}
.status-pill.offline {
  background: #ef4444;
}
@keyframes pulse-dot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(1.2); }
}

/* MAIN LAYOUT */
.kiosk-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.4fr) minmax(380px, 440px);
  gap: 20px;
  padding: 20px 24px;
  flex: 1;
  max-width: 1600px;
  margin: 0 auto;
  width: 100%;
}

/* CAMERA STAGE */
.camera-card {
  background: #111827;
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
}
.camera-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 18px;
  background: rgba(17, 24, 39, 0.95);
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  flex-wrap: wrap;
  gap: 10px;
}
.toolbar-group {
  display: flex;
  align-items: center;
  gap: 8px;
}
.btn-toggle {
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
  border: 1px solid rgba(255, 255, 255, 0.12);
  background: rgba(255, 255, 255, 0.04);
  color: #cbd5e1;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-toggle.active {
  background: #2563eb;
  color: #fff;
  border-color: #3b82f6;
  box-shadow: 0 2px 8px var(--primary-glow);
}
.input-ip {
  background: #1e293b;
  border: 1px solid rgba(255, 255, 255, 0.12);
  color: #fff;
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 12px;
  width: 150px;
}

.video-container {
  position: relative;
  background: #030712;
  flex: 1;
  min-height: 480px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  padding: 12px;
}
.video-stage {
  position: relative;
  width: 100%;
  max-width: 680px;
  aspect-ratio: 4 / 3;
  border-radius: 14px;
  overflow: hidden;
  background: #000;
  box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
}
#webcamVideo, #espStreamImg {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
#webcamVideo {
  transform: scaleX(-1);
}
#espStreamImg {
  display: none;
}
#overlayCanvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 5;
}

.camera-hud {
  position: absolute;
  bottom: 14px;
  left: 14px;
  right: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  pointer-events: none;
}
.hud-pill {
  background: rgba(15, 23, 42, 0.88);
  backdrop-filter: blur(8px);
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 700;
  color: #e2e8f0;
  border: 1px solid rgba(255, 255, 255, 0.12);
}

/* SIDE PANEL */
.side-card {
  background: #111827;
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.side-tabs {
  display: flex;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  background: rgba(17, 24, 39, 0.6);
}
.side-tab-btn {
  flex: 1;
  padding: 13px;
  text-align: center;
  font-size: 13px;
  font-weight: 700;
  color: #94a3b8;
  background: transparent;
  border: none;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
}
.side-tab-btn.active {
  color: #60a5fa;
  border-bottom-color: #3b82f6;
  background: rgba(59, 130, 246, 0.08);
}

.tab-pane {
  display: none;
  padding: 18px;
  flex: 1;
  overflow-y: auto;
}
.tab-pane.active {
  display: flex;
  flex-direction: column;
}

/* BIG CELEBRATION POPUP CHÍNH DIỆN */
.big-match-overlay {
  position: absolute;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) scale(0.92);
  width: 90%;
  max-width: 460px;
  background: rgba(15, 23, 42, 0.95);
  border: 2px solid #22c55e;
  border-radius: 20px;
  padding: 18px 22px;
  display: flex;
  align-items: center;
  gap: 18px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.85), 0 0 35px rgba(34, 197, 94, 0.45);
  backdrop-filter: blur(16px);
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.big-match-overlay.show {
  opacity: 1;
  transform: translateX(-50%) scale(1);
  pointer-events: auto;
}
.big-avatar {
  width: 72px;
  height: 72px;
  border-radius: 16px;
  object-fit: cover;
  border: 3px solid #22c55e;
  box-shadow: 0 0 20px rgba(34, 197, 94, 0.5);
  flex-shrink: 0;
  background: #1e293b;
}
.big-name {
  font-size: 19px;
  font-weight: 800;
  color: #fff;
  letter-spacing: -0.01em;
  line-height: 1.25;
}
.big-detail {
  font-size: 12.5px;
  color: #94a3b8;
  margin-top: 3px;
}
.big-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: #22c55e;
  color: #052e16;
  font-size: 11px;
  font-weight: 800;
  padding: 3px 9px;
  border-radius: 6px;
  margin-top: 6px;
}

/* HIỆU ỨNG TIA QUÉT LASER & KHUNG NGẮM */
.scan-laser-line {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 3px;
  background: linear-gradient(90deg, transparent, #38bdf8, #60a5fa, transparent);
  box-shadow: 0 0 14px #38bdf8, 0 0 22px #60a5fa;
  animation: scanLaserAnim 2.8s ease-in-out infinite alternate;
  pointer-events: none;
  z-index: 12;
}
@keyframes scanLaserAnim {
  0% { top: 6%; opacity: 0.3; }
  50% { opacity: 0.95; }
  100% { top: 92%; opacity: 0.3; }
}
.target-reticle {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 260px;
  height: 320px;
  border: 2px dashed rgba(56, 189, 248, 0.35);
  border-radius: 28px;
  pointer-events: none;
  z-index: 8;
  transition: all 0.25s ease;
}
.target-reticle.matched {
  border-color: #22c55e;
  border-style: solid;
  box-shadow: 0 0 25px rgba(34, 197, 94, 0.4);
}

.history-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex: 1;
  overflow-y: auto;
}
.history-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 10px;
}
.history-item-left {
  display: flex;
  align-items: center;
  gap: 10px;
}
.history-avatar {
  width: 34px;
  height: 34px;
  border-radius: 8px;
  object-fit: cover;
  background: #1e293b;
}
.history-name {
  font-size: 13px;
  font-weight: 700;
  color: #f8fafc;
}
.history-mssv {
  font-size: 11px;
  color: #94a3b8;
}
.history-time {
  font-size: 12px;
  color: #22c55e;
  font-weight: 700;
}

/* ROSTER LIST */
.roster-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  overflow-y: auto;
  max-height: calc(100vh - 220px);
  padding-right: 2px;
}
.roster-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.07);
  border-radius: 10px;
  transition: all 0.2s;
}
.roster-item.checked-in {
  background: rgba(34, 197, 94, 0.08);
  border-color: rgba(34, 197, 94, 0.28);
}
.roster-avatar {
  width: 44px;
  height: 44px;
  border-radius: 10px;
  object-fit: cover;
  background: #1e293b;
  border: 2px solid rgba(255, 255, 255, 0.12);
  flex-shrink: 0;
}
.roster-item.checked-in .roster-avatar {
  border-color: #22c55e;
}
.roster-info {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.roster-top-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.roster-name {
  font-size: 13.5px;
  font-weight: 800;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.roster-status-badge {
  font-size: 10px;
  font-weight: 800;
  padding: 3px 8px;
  border-radius: 6px;
  white-space: nowrap;
}
.roster-status-badge.ok {
  background: #22c55e;
  color: #052e16;
}
.roster-status-badge.excused {
  background: #6366f1;
  color: #ffffff;
}
.roster-status-badge.pending {
  background: rgba(255, 255, 255, 0.06);
  color: #94a3b8;
  border: 1px solid rgba(255, 255, 255, 0.1);
}
.roster-bottom-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11.5px;
  color: #94a3b8;
  flex-wrap: wrap;
}
.roster-mssv b {
  color: #38bdf8;
  font-weight: 800;
}
.roster-class {
  color: #94a3b8;
}
.roster-face-tag {
  font-size: 9.5px;
  font-weight: 700;
  color: #38bdf8;
  background: rgba(56, 189, 248, 0.12);
  padding: 1px 6px;
  border-radius: 4px;
  border: 1px solid rgba(56, 189, 248, 0.2);
}
.roster-face-tag.warn {
  color: #f59e0b;
  background: rgba(245, 158, 11, 0.12);
  border-color: rgba(245, 158, 11, 0.25);
}

.form-input {
  width: 100%;
  padding: 10px 12px;
  background: #1e293b;
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 8px;
  color: #fff;
  font-family: inherit;
  font-size: 13px;
}
.btn-del {
  background: transparent;
  border: none;
  color: #f87171;
  cursor: pointer;
  padding: 4px 8px;
  font-size: 12px;
}

@media (max-width: 900px) {
  .kiosk-grid { grid-template-columns: 1fr; }
  .video-container { min-height: 320px; }
}
</style>
</head>
<body>

<!-- TOP NAV -->
<header class="kiosk-nav">
  <div class="kiosk-brand">
    <div class="kiosk-logo-badge">📷</div>
    <div>
      <div class="kiosk-title">LH-NaviX · Camera Điểm Danh Khuôn Mặt AI</div>
      <div class="kiosk-subtitle">Nhận diện khuôn mặt tự động & Điểm danh tức thì</div>
    </div>
  </div>

  <div style="display:flex;align-items:center;gap:12px;">
    <div class="kiosk-status-badge" id="sessionBadge">
      <span class="status-pill" id="sessionPill"></span>
      <span id="sessionText">Đang tìm phiên...</span>
    </div>
    <button type="button" id="btnQuickOpen" onclick="quickOpenSession()" style="display:none;background:#22c55e;color:#052e16;border:none;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:800;cursor:pointer;">+ Mở phiên ngay</button>
  </div>
</header>

<!-- MAIN CONTENT -->
<main class="kiosk-grid">

  <!-- LEFT: CAMERA STAGE (DÀNH CHO SINH VIÊN QUÉT) -->
  <section class="camera-card">
    <div class="camera-toolbar">
      <div class="toolbar-group">
        <span style="font-size:12px;font-weight:700;color:#94a3b8;">📡 ESP32:</span>
        <input type="text" class="input-ip" id="espIpInput" placeholder="192.168.2.168" value="192.168.2.168" style="width:130px;padding:5px 8px;font-size:12px;">
        <button type="button" class="btn-toggle active" onclick="connectEspCamera()" style="padding:5px 10px;font-size:12px;">Kết nối</button>
      </div>

      <div class="toolbar-group">
        <button type="button" class="btn-toggle" id="btnAntiSpoof" onclick="toggleAntiSpoof()" title="Đang bật kiểm tra người thật 3D (Yêu cầu quay đầu/chớp mắt)">🛡️ Nghiêm ngặt</button>
        <button type="button" class="btn-toggle" onclick="toggleEspFlip()" title="Lật gương camera nếu bị ngược chiều">🔄 Lật</button>
        <button type="button" class="btn-toggle" onclick="toggleFullscreen()">⛶ Toàn màn hình</button>
      </div>
    </div>

    <div class="video-container" id="videoBox">
      <div class="video-stage" id="videoStage">
        <!-- TIA QUÉT LASER & KHUNG NGẮM CÔNG NGHỆ -->
        <div class="scan-laser-line"></div>
        <div class="target-reticle" id="targetReticle"></div>

        <!-- WEBCAM VIDEO -->
        <video id="webcamVideo" autoplay muted playsinline></video>
        <!-- ESP32 NATIVE STREAM (MƯỢT 30-60 FPS) -->
        <img id="espStreamImg" crossorigin="anonymous" alt="ESP32 Stream">
        <!-- DRAWING CANVAS (BBOX & LABELS) -->
        <canvas id="overlayCanvas"></canvas>

        <!-- CARD CHÚC MỪNG LỚN (NỔI BẬT CHÍNH DIỆN) -->
        <div class="big-match-overlay" id="bigMatchOverlay">
          <img class="big-avatar" id="bigMatchAvatar" src="images/logo.png" alt="Avatar">
          <div style="min-width:0;flex:1;">
            <div class="big-name" id="bigMatchName">—</div>
            <div class="big-detail" id="bigMatchDetail">—</div>
            <div class="big-badge">✓ ĐÃ ĐIỂM DANH THÀNH CÔNG</div>
          </div>
        </div>
      </div>

      <div class="camera-hud">
        <div class="hud-pill" id="hudStatus">⏳ Đang khởi động mô hình AI...</div>
        <div class="hud-pill" id="hudCount">Đã nạp: <b id="enrolledCount">0</b> bạn</div>
      </div>
    </div>
  </section>

  <!-- RIGHT: SIDEBAR (DANH SÁCH SINH VIÊN KÈM AVATAR & LƯỢT VỪA ĐIỂM DANH) -->
  <aside class="side-card">
    <nav class="side-tabs">
      <button type="button" class="side-tab-btn active" id="tabBtnRecent" onclick="switchTab('recent')">🟢 Vừa điểm danh (<span id="recentCount">0</span>)</button>
      <button type="button" class="side-tab-btn" id="tabBtnRoster" onclick="switchTab('roster')">👥 Danh sách sinh viên (<span id="rosterCount">0</span>)</button>
    </nav>

    <!-- TAB 1: RECENT CHECK-INS (VỪA ĐIỂM DANH) -->
    <div class="tab-pane active" id="tabRecent">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <span style="font-size:11px;font-weight:800;text-transform:uppercase;color:#94a3b8;">Lượt vừa nhận diện:</span>
        <button type="button" class="btn-del" id="btnClearHistory" onclick="clearAttendanceHistory()" style="background:rgba(239,68,68,0.12);color:#f87171;border:1px solid rgba(239,68,68,0.25);border-radius:6px;padding:4px 8px;font-size:11px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:4px;">
          🗑️ Xóa danh sách
        </button>
      </div>
      <div class="history-list" id="historyList">
        <div style="color:#64748b;font-size:13px;text-align:center;padding:40px 0;">Chưa có lượt điểm danh nào</div>
      </div>
    </div>

    <!-- TAB 2: ROSTER (DANH SÁCH TẤT CẢ SINH VIÊN - AVATAR KÈM MSSV) -->
    <div class="tab-pane" id="tabRoster">
      <div style="margin-bottom:10px;">
        <input type="text" class="form-input" id="rosterSearchInput" placeholder="🔍 Tìm theo MSSV hoặc Họ tên..." oninput="filterRoster(this.value)">
      </div>
      <div class="roster-list" id="rosterList">
        <div style="color:#64748b;font-size:13px;text-align:center;padding:40px 0;">Đang tải danh sách sinh viên...</div>
      </div>
    </div>
  </aside>

</main>

<script>
// ==========================================
// STATE & CONFIG
// ==========================================
function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

let cameraMode = 'esp';
let isModelLoaded = false;
let isDetecting = false;
let currentSession = null;
let labeledDescriptors = [];
let faceMatcher = null;
let studentsList = [];
let localMapping = [];
let recentCheckins = [];
let lastCheckinTime = {};
let consecutiveHits = {};
let tempSamples = [];

let antiSpoofEnabled = true;
const livenessState = {}; // label -> session object
let activeKioskLabel = null;
let kioskLostFaceFrames = 0;

function toggleAntiSpoof() {
  antiSpoofEnabled = !antiSpoofEnabled;
  const btn = document.getElementById('btnAntiSpoof');
  if (btn) {
    btn.classList.toggle('active', !antiSpoofEnabled);
    btn.textContent = antiSpoofEnabled ? '🛡️ Chế độ: Nghiêm ngặt (Chống ảnh thẻ)' : '⚡ Chế độ: Siêu tốc 1s';
    btn.title = antiSpoofEnabled ? 'Đang bật kiểm tra người thật 3D (Yêu cầu quay đầu/chớp mắt)' : 'Chế độ siêu tốc 1s (Không kiểm tra cử động người thật)';
  }
  Object.keys(livenessState).forEach(k => delete livenessState[k]);
  activeKioskLabel = null;
  kioskLostFaceFrames = 0;
}

// ==========================================
// HỆ THỐNG CHỐNG GIAN LẬN 3D (HEAD YAW PARALLAX & DYNAMIC LIVENESS)
// Chuyên dụng cho ESP32-CAM: Bắt cử động quay đầu 3D (Trái/Phải) hoặc chớp mắt
// Loại bỏ 100% ảnh thẻ giấy và màn hình điện thoại phẳng!
// ==========================================

// 1. Tính Eye Aspect Ratio (EAR) - Tỉ lệ mở mắt chuẩn 6 điểm landmarks
function calculateEyeEAR(eye) {
  if (!eye || eye.length < 6) return 0.28;
  const p1_p5 = Math.hypot(eye[1].x - eye[5].x, eye[1].y - eye[5].y);
  const p2_p4 = Math.hypot(eye[2].x - eye[4].x, eye[2].y - eye[4].y);
  const p0_p3 = Math.hypot(eye[0].x - eye[3].x, eye[0].y - eye[3].y);
  return p0_p3 > 1 ? (p1_p5 + p2_p4) / (2.0 * p0_p3) : 0.28;
}

// 2. Tính Mouth Aspect Ratio (MAR) - Tỉ lệ mở miệng/cười chuẩn 20 điểm landmarks miệng
function calculateMAR(mouth) {
  if (!mouth || mouth.length < 12) return 0.16;
  const p0_p6 = Math.hypot(mouth[0].x - mouth[6].x, mouth[0].y - mouth[6].y);
  if (p0_p6 < 1) return 0.16;
  const p2_p10 = Math.hypot(mouth[2].x - mouth[10].x, mouth[2].y - mouth[10].y);
  const p3_p9 = Math.hypot(mouth[3].x - mouth[9].x, mouth[3].y - mouth[9].y);
  const p4_p8 = Math.hypot(mouth[4].x - mouth[8].x, mouth[4].y - mouth[8].y);
  return (p2_p10 + p3_p9 + p4_p8) / (2.0 * p0_p6);
}

// 3. Tính tỉ lệ lệch 3D chóp mũi so với 2 bên má (3D Head Yaw Parallax)
function calculateHeadYaw(landmarks) {
  if (!landmarks) return 1.0;
  const nose = landmarks.getNose();
  const jaw = landmarks.getJawOutline();
  if (!nose || !jaw || jaw.length < 17) return 1.0;

  const noseTip = nose[3] || nose[0]; // Chóp mũi (Landmark 30)
  const leftCheek = jaw[1];           // Má trái (Landmark 1)
  const rightCheek = jaw[15];         // Má phải (Landmark 15)

  const dLeft = Math.hypot(noseTip.x - leftCheek.x, noseTip.y - leftCheek.y);
  const dRight = Math.hypot(noseTip.x - rightCheek.x, noseTip.y - rightCheek.y);

  if (dRight < 1) return 1.0;
  return dLeft / dRight;
}

// Kiểm tra độ sống động người thật bằng State Machine (Active Challenge Transition)
function evaluateLiveness(label, landmarks, box) {
  if (!antiSpoofEnabled) {
    return { isLive: true, prompt: '⚡ Siêu tốc (Không chống ảnh)', isStaticPhoto: false, isFailed: false };
  }
  if (!landmarks) {
    return { isLive: false, prompt: '🔍 Đang căn chỉnh khuôn mặt...', isStaticPhoto: false, isFailed: false };
  }
  if (!box || box.width < 50) {
    return { isLive: false, prompt: '🔍 Hãy đứng gần camera hơn...', isStaticPhoto: false, isFailed: false };
  }

  const yaw = calculateHeadYaw(landmarks);
  const leftEAR = calculateEyeEAR(landmarks.getLeftEye());
  const rightEAR = calculateEyeEAR(landmarks.getRightEye());
  const avgEAR = (leftEAR + rightEAR) / 2.0;
  const mar = calculateMAR(landmarks.getMouth());
  const now = Date.now();

  const boxCenterX = box.x + box.width / 2;
  const boxCenterY = box.y + box.height / 2;

  // 1. KHỞI TẠO HOẶC LẤY PHIÊN THỬ THÁCH
  if (!livenessState[label]) {
    const challenges = ['blink', 'turn_left', 'turn_right', 'smile'];
    const selectedChallenge = challenges[Math.floor(Math.random() * challenges.length)];

    livenessState[label] = {
      challenge: selectedChallenge,
      stage: 'CALIBRATING', // CALIBRATING -> ACTION_HOLD -> RETURNING -> PASSED
      sessionStartTime: now,
      stageStartTime: now,
      lastSeenTime: now,

      baselineEAR: avgEAR,
      baselineYaw: yaw,
      baselineMAR: mar,

      straightFrames: 0,
      actionFrames: 0,
      returnFrames: 0,

      lastBoxX: boxCenterX,
      lastBoxY: boxCenterY,
      lastBoxW: box.width,

      earHistory: [avgEAR],
      yawHistory: [yaw],

      isFailed: false,
      failReason: ''
    };
  }

  const st = livenessState[label];
  st.lastSeenTime = now;

  // 2. NẾU ĐÃ THẤT BẠI: Duy trì cảnh báo 2s rồi tự xóa phiên
  if (st.isFailed) {
    if (now - st.stageStartTime > 2000) {
      delete livenessState[label];
      if (activeKioskLabel === label) activeKioskLabel = null;
    }
    return { isLive: false, prompt: `❌ ${st.failReason || 'Xác minh thất bại! Vui lòng thử lại'}`, isStaticPhoto: true, isFailed: true };
  }

  // 3. TIMEOUT TOÀN PHIÊN (Tối đa 7.0 giây)
  if (now - st.sessionStartTime > 7000) {
    st.isFailed = true;
    st.stageStartTime = now;
    st.failReason = 'Hết thời gian xác minh! Vui lòng thử lại';
    return { isLive: false, prompt: '❌ ' + st.failReason, isStaticPhoto: true, isFailed: true };
  }

  // 4. KIỂM TRA RUNG LẮC / DI CHUYỂN ĐỘT NGỘT
  if (st.lastBoxX) {
    const shift = Math.hypot(boxCenterX - st.lastBoxX, boxCenterY - st.lastBoxY);
    const sizeDiff = Math.abs(box.width - st.lastBoxW) / st.lastBoxW;
    st.lastBoxX = boxCenterX;
    st.lastBoxY = boxCenterY;
    st.lastBoxW = box.width;

    if (shift > box.width * 0.22 || sizeDiff > 0.25) {
      st.stage = 'CALIBRATING';
      st.straightFrames = 0;
      st.actionFrames = 0;
      st.returnFrames = 0;
      st.stageStartTime = now;
      return { isLive: false, prompt: '⚠️ Hãy giữ yên khuôn mặt trước camera...', isStaticPhoto: false, isFailed: false };
    }
  } else {
    st.lastBoxX = boxCenterX;
    st.lastBoxY = boxCenterY;
    st.lastBoxW = box.width;
  }

  st.earHistory.push(avgEAR);
  if (st.earHistory.length > 15) st.earHistory.shift();
  st.yawHistory.push(yaw);
  if (st.yawHistory.length > 15) st.yawHistory.shift();

  // 5. TIẾN TRÌNH STATE MACHINE

  // GIAI ĐOẠN 1: BẮT BUỘC NHÌN THẲNG & NÉT MẶT TỰ NHIÊN
  if (st.stage === 'CALIBRATING') {
    const isLookingStraight = (yaw >= 0.85 && yaw <= 1.18);
    const isEyeOpen = (avgEAR >= 0.22);
    const isMouthNeutral = (mar <= 0.30);

    if (isLookingStraight && isEyeOpen && isMouthNeutral) {
      st.straightFrames++;
      st.baselineEAR = st.baselineEAR * 0.7 + avgEAR * 0.3;
      st.baselineYaw = st.baselineYaw * 0.7 + yaw * 0.3;
      st.baselineMAR = st.baselineMAR * 0.7 + mar * 0.3;

        if (st.straightFrames >= 4) {
        st.stage = 'ACTION_HOLD';
        st.stageStartTime = now;
        st.actionFrames = 0;
        st.returnFrames = 0;
      }
    } else {
      st.straightFrames = 0;
    }

    let guideText = '👀 Nhìn thẳng vào camera...';
    if (!isLookingStraight) {
      guideText = (yaw < 0.85) ? '👉 Hãy quay mặt về chính giữa camera' : '👈 Hãy quay mặt về chính giữa camera';
    } else if (!isEyeOpen) {
      guideText = '👀 Hãy mở to mắt nhìn thẳng vào camera';
    } else if (!isMouthNeutral) {
      guideText = '😐 Hãy giữ nét mặt tự nhiên (không cười lớn)';
    }
    return { isLive: false, prompt: guideText, isStaticPhoto: false, isFailed: false };
  }

  if (st.stage === 'ACTION_HOLD' && (now - st.stageStartTime > 4500)) {
    st.isFailed = true;
    st.stageStartTime = now;
    st.failReason = 'Chưa hoàn thành động tác yêu cầu';
    return { isLive: false, prompt: '❌ Thao tác quá chậm, vui lòng thử lại', isStaticPhoto: true, isFailed: true };
  }

  // --- THỬ THÁCH 1: CHỚP MẮT ---
  if (st.challenge === 'blink') {
    if (st.stage === 'ACTION_HOLD') {
      const isClosed = (avgEAR <= st.baselineEAR * 0.65) && (avgEAR <= 0.16) && (leftEAR <= 0.17) && (rightEAR <= 0.17);
      if (isClosed) {
        st.actionFrames++;
        if (st.actionFrames >= 2) {
          st.stage = 'RETURNING';
          st.stageStartTime = now;
          st.returnFrames = 0;
        }
      } else {
        st.actionFrames = 0;
      }
      return { isLive: false, prompt: '👁️ Hãy CHỚP MẮT 1 lần để điểm danh...', isStaticPhoto: false, isFailed: false };
    }

    if (st.stage === 'RETURNING') {
      if (now - st.stageStartTime > 2500) {
        st.isFailed = true;
        st.stageStartTime = now;
        st.failReason = 'Mắt chưa mở to trở lại';
        return { isLive: false, prompt: '❌ Vui lòng thử lại', isStaticPhoto: true, isFailed: true };
      }
      const isReopened = (avgEAR >= st.baselineEAR * 0.85) && (avgEAR >= 0.22);
      if (isReopened) {
        st.returnFrames++;
        if (st.returnFrames >= 2) {
          return { isLive: true, prompt: '✅ ĐÃ XÁC MINH NGƯỜI THẬT (CHỚP MẮT THÀNH CÔNG)!', isStaticPhoto: false, isFailed: false };
        }
      } else {
        st.returnFrames = 0;
      }
      return { isLive: false, prompt: '👁️ Hãy mở to mắt nhìn thẳng vào camera...', isStaticPhoto: false, isFailed: false };
    }
  }

  // --- THỬ THÁCH 2: QUAY ĐẦU SANG TRÁI ---
  if (st.challenge === 'turn_left') {
    if (st.stage === 'ACTION_HOLD') {
      const isTurnedLeft = (yaw <= 0.58);
      if (isTurnedLeft) {
        st.actionFrames++;
        if (st.actionFrames >= 2) {
          st.stage = 'RETURNING';
          st.stageStartTime = now;
          st.returnFrames = 0;
        }
      } else {
        st.actionFrames = 0;
      }
      return { isLive: false, prompt: '↩️ Hãy quay nhẹ đầu sang TRÁI...', isStaticPhoto: false, isFailed: false };
    }

    if (st.stage === 'RETURNING') {
      if (now - st.stageStartTime > 2500) {
        st.isFailed = true;
        st.stageStartTime = now;
        st.failReason = 'Chưa quay lại nhìn thẳng';
        return { isLive: false, prompt: '❌ Vui lòng thử lại', isStaticPhoto: true, isFailed: true };
      }
      const isBackStraight = (yaw >= 0.85 && yaw <= 1.18) && (avgEAR >= 0.22);
      if (isBackStraight) {
        st.returnFrames++;
        if (st.returnFrames >= 2) {
          return { isLive: true, prompt: '✅ ĐÃ XÁC MINH NGƯỜI THẬT (QUAY ĐẦU THÀNH CÔNG)!', isStaticPhoto: false, isFailed: false };
        }
      } else {
        st.returnFrames = 0;
      }
      return { isLive: false, prompt: '👀 Giờ hãy quay lại nhìn thẳng vào camera...', isStaticPhoto: false, isFailed: false };
    }
  }

  // --- THỬ THÁCH 3: QUAY ĐẦU SANG PHẢI ---
  if (st.challenge === 'turn_right') {
    if (st.stage === 'ACTION_HOLD') {
      const isTurnedRight = (yaw >= 1.45);
      if (isTurnedRight) {
        st.actionFrames++;
        if (st.actionFrames >= 2) {
          st.stage = 'RETURNING';
          st.stageStartTime = now;
          st.returnFrames = 0;
        }
      } else {
        st.actionFrames = 0;
      }
      return { isLive: false, prompt: '↪️ Hãy quay nhẹ đầu sang PHẢI...', isStaticPhoto: false, isFailed: false };
    }

    if (st.stage === 'RETURNING') {
      if (now - st.stageStartTime > 2500) {
        st.isFailed = true;
        st.stageStartTime = now;
        st.failReason = 'Chưa quay lại nhìn thẳng';
        return { isLive: false, prompt: '❌ Vui lòng thử lại', isStaticPhoto: true, isFailed: true };
      }
      const isBackStraight = (yaw >= 0.85 && yaw <= 1.18) && (avgEAR >= 0.22);
      if (isBackStraight) {
        st.returnFrames++;
        if (st.returnFrames >= 2) {
          return { isLive: true, prompt: '✅ ĐÃ XÁC MINH NGƯỜI THẬT (QUAY ĐẦU THÀNH CÔNG)!', isStaticPhoto: false, isFailed: false };
        }
      } else {
        st.returnFrames = 0;
      }
      return { isLive: false, prompt: '👀 Giờ hãy quay lại nhìn thẳng vào camera...', isStaticPhoto: false, isFailed: false };
    }
  }

  // --- THỬ THÁCH 4: MỈM CƯỜI ---
  if (st.challenge === 'smile') {
    if (st.stage === 'ACTION_HOLD') {
      const isSmiling = (mar >= st.baselineMAR * 1.55) && (mar >= 0.38);
      if (isSmiling) {
        st.actionFrames++;
        if (st.actionFrames >= 2) {
          st.stage = 'RETURNING';
          st.stageStartTime = now;
          st.returnFrames = 0;
        }
      } else {
        st.actionFrames = 0;
      }
      return { isLive: false, prompt: '😊 Hãy MỈM CƯỜI 1 lần để điểm danh...', isStaticPhoto: false, isFailed: false };
    }

    if (st.stage === 'RETURNING') {
      if (now - st.stageStartTime > 2500) {
        st.isFailed = true;
        st.stageStartTime = now;
        st.failReason = 'Chưa khép miệng tự nhiên';
        return { isLive: false, prompt: '❌ Vui lòng thử lại', isStaticPhoto: true, isFailed: true };
      }
      const isBackNeutral = (mar <= 0.28) && (avgEAR >= 0.22);
      if (isBackNeutral) {
        st.returnFrames++;
        if (st.returnFrames >= 2) {
          return { isLive: true, prompt: '✅ ĐÃ XÁC MINH NGƯỜI THẬT (MỈM CƯỜI THÀNH CÔNG)!', isStaticPhoto: false, isFailed: false };
        }
      } else {
        st.returnFrames = 0;
      }
      return { isLive: false, prompt: '😐 Khép miệng nhìn thẳng vào camera...', isStaticPhoto: false, isFailed: false };
    }
  }

  return { isLive: false, prompt: '👀 Nhìn thẳng vào camera...', isStaticPhoto: false, isFailed: false };
}

let currentRosterFilter = '';
let checkedInMssvs = new Set();
let excusedMssvs = new Set();

function filterRoster(q) {
  currentRosterFilter = (q || '').trim().toLowerCase();
  renderStudentRoster();
}

function renderStudentRoster() {
  const container = document.getElementById('rosterList');
  if (!container) return;
  const countBadge = document.getElementById('rosterCount');
  if (countBadge) countBadge.textContent = studentsList.length;

  const db = JSON.parse(localStorage.getItem('face_descriptors_db') || '{}');

  let list = studentsList;
  if (currentRosterFilter) {
    list = list.filter(s => 
      (s.name && s.name.toLowerCase().includes(currentRosterFilter)) || 
      (s.mssv && s.mssv.toLowerCase().includes(currentRosterFilter)) ||
      (s.class && s.class.toLowerCase().includes(currentRosterFilter))
    );
  }

  if (list.length === 0) {
    container.innerHTML = '<div style="color:#64748b;font-size:13px;text-align:center;padding:30px 0;">Không tìm thấy sinh viên nào</div>';
    return;
  }

  container.innerHTML = list.map(st => {
    const avatarUrl = st.avatar || `images/faces/${st.mssv}.jpg`;
    const isDone = checkedInMssvs.has(st.mssv);
    const isExcused = !isDone && excusedMssvs.has(st.mssv);
    const label = `${st.mssv} - ${st.name}`;
    const faceCount = (db[label] && db[label].length) || 0;
    const badgeText = isDone ? '✓ Đã điểm danh' : (isExcused ? '📝 Nghỉ phép' : 'Chưa điểm danh');
    const badgeClass = isDone ? 'ok' : (isExcused ? 'excused' : 'pending');

    return `
      <div class="roster-item ${isDone ? 'checked-in' : (isExcused ? 'excused-leave' : '')}">
        <img class="roster-avatar" src="${avatarUrl}" onerror="this.src='images/logo.png'">
        <div class="roster-info">
          <div class="roster-top-row">
            <span class="roster-name">${escapeHtml(st.name)}</span>
            <span class="roster-status-badge ${badgeClass}">${badgeText}</span>
          </div>
          <div class="roster-bottom-row">
            <span class="roster-mssv">MSSV: <b>${escapeHtml(st.mssv)}</b></span>
            ${st.class ? `<span class="roster-class">${escapeHtml(st.class)}</span>` : ''}
            ${faceCount > 0 ? `<span class="roster-face-tag">🧠 ${faceCount} mẫu</span>` : '<span class="roster-face-tag warn">Chưa có mẫu</span>'}
          </div>
        </div>
      </div>
    `;
  }).join('');
}

// Load mapping extracted from docx
async function loadStudentsMapping() {
  try {
    const res = await fetch('images/faces/students_mapping.json');
    if (res.ok) {
      localMapping = await res.json();
    }
  } catch(e) {
    console.warn('Chưa có students_mapping.json:', e);
  }

  // Load from Supabase
  try {
    const { data } = await window.supabase.from('students').select('*').order('name');
    studentsList = data || [];
    
    // Ghép thông tin avatar nếu có
    if (localMapping.length > 0) {
      localMapping.forEach(m => {
        const found = studentsList.find(s => s.mssv === m.mssv);
        if (found) {
          found.avatar = m.avatar || `images/faces/${m.mssv}.jpg`;
          found.class = m.class || '';
          found.phone = m.phone || '';
        } else {
          studentsList.push({
            mssv: m.mssv,
            name: m.name,
            class: m.class || '',
            phone: m.phone || '',
            avatar: m.avatar || `images/faces/${m.mssv}.jpg`
          });
        }
      });
    }

    renderStudentRoster();
  } catch (e) {
    console.error('Lỗi load sinh viên:', e);
  }
}

// Kiểm tra phiên điểm danh Supabase (kết hợp RPC get_open_session được cấp quyền cho anon)
async function checkActiveSession() {
  try {
    // 1. Ưu tiên gọi hàm RPC get_open_session chuẩn của Supabase (không bị RLS chặn)
    let active = null;
    try {
      const { data: openData, error: rpcErr } = await window.supabase.rpc('get_open_session');
      if (!rpcErr && openData && openData.id) {
        active = openData;
      }
    } catch(e) {}

    // 2. Dự phòng: query trực tiếp bảng sessions
    if (!active) {
      try {
        const { data: tblData } = await window.supabase
          .from('sessions')
          .select('*')
          .eq('is_open', true)
          .order('started_at', { ascending: false })
          .limit(1)
          .maybeSingle();
        if (tblData) active = tblData;
      } catch(e) {}
    }

    const pill = document.getElementById('sessionPill');
    const txt = document.getElementById('sessionText');
    const btnQuick = document.getElementById('btnQuickOpen');

    if (active) {
      currentSession = active;
      pill.className = 'status-pill online';
      txt.textContent = `Phiên mở: ${active.session_name}`;
      btnQuick.style.display = 'none';

      // Tải danh sách các bạn đã điểm danh trong phiên này
      try {
        checkedInMssvs.clear();
        excusedMssvs.clear();
        const { data: attData } = await window.supabase
          .from('attendance')
          .select('mssv, status')
          .eq('session_id', active.id);
        if (attData && attData.length > 0) {
          attData.forEach(a => {
            if (a.status === 'có mặt' || a.status === 'đi muộn') {
              checkedInMssvs.add(a.mssv);
            } else if (a.status === 'vắng có phép') {
              excusedMssvs.add(a.mssv);
            }
          });
          renderStudentRoster();
        }
      } catch(e) {}
    } else {
      currentSession = null;
      pill.className = 'status-pill offline';
      txt.textContent = 'Chưa có phiên nào mở';
      btnQuick.style.display = 'inline-block';
    }
  } catch (e) {
    console.warn('checkActiveSession error:', e);
  }
}

async function quickOpenSession() {
  const name = prompt('Nhập tên phiên điểm danh nhanh:', 'Phiên Camera Face ' + new Date().toLocaleTimeString('vi-VN'));
  if (!name) return;

  try {
    // 1. Thử gọi RPC admin_open_session
    const { data: rpcRes, error: rpcErr } = await window.supabase.rpc('admin_open_session', {
      p_name: name,
      p_duration_min: 90,
      p_warn_before_min: 10
    });

    if (!rpcErr && rpcRes?.ok) {
      alert('✓ Đã mở phiên điểm danh trên Supabase thành công!');
      await checkActiveSession();
      return;
    }

    // 2. Thử insert trực tiếp bảng sessions
    const { data: insData, error: insErr } = await window.supabase.from('sessions').insert({
      session_name: name,
      is_open: true,
      started_at: new Date().toISOString(),
      duration_min: 90,
      qr_token: 'face_cam_' + Date.now()
    }).select().single();

    if (!insErr && insData) {
      alert('✓ Đã mở phiên điểm danh thành công!');
      await checkActiveSession();
      return;
    }

    // 3. Nếu cả 2 đều bị Supabase RLS chặn (do chưa đăng nhập Admin)
    const openAdmin = confirm(

async function startWebcam() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' }
    });
    webcamVideo.srcObject = stream;
    webcamVideo.style.display = 'block';
    if (espImg) {
      espImg.style.display = 'none';
      espImg.src = '';
    }
    if (espInterval) { clearInterval(espInterval); espInterval = null; }
  } catch (e) {
    console.warn('Webcam error:', e);
    hudStatus.textContent = '⚠️ Chưa mở được webcam máy tính.';
  }
}

function stopWebcam() {
  if (webcamVideo.srcObject) {
    webcamVideo.srcObject.getTracks().forEach(t => t.stop());
    webcamVideo.srcObject = null;
  }
  Object.keys(livenessState).forEach(k => delete livenessState[k]);
  activeKioskLabel = null;
  kioskLostFaceFrames = 0;
}

function switchCameraMode(mode) {
  cameraMode = mode;
  document.getElementById('btnModeWebcam').classList.toggle('active', mode === 'webcam');
  document.getElementById('btnModeEsp').classList.toggle('active', mode === 'esp');
  document.getElementById('espConfigGroup').style.display = (mode === 'esp') ? 'flex' : 'none';

  if (mode === 'webcam') {
    if (espImg) {
      espImg.style.display = 'none';
      espImg.src = '';
    }
    startWebcam();
  } else {
    stopWebcam();
    webcamVideo.style.display = 'none';
    connectEspCamera();
  }
}

let espRotation = 0; // 0, 90, 180, 270

let espMirrored = false;

function toggleEspFlip() {
  espMirrored = !espMirrored;
  if (espImg) {
    espImg.style.transform = espMirrored ? 'scaleX(-1)' : 'none';
  }
  hudStatus.textContent = espMirrored ? '🔄 Chế độ ESP32: Lật gương (Soi gương)' : '🔄 Chế độ ESP32: Bình thường';
}

function formatEspStreamUrl(raw) {
  let s = (raw || '').trim();
  if (!s) return '';
  s = s.replace(/^https?:\/\//i, '');
  s = s.replace(/\/.*$/, '');
  let host = s;
  let port = '81';
  if (s.includes(':')) {
    const parts = s.split(':');
    host = parts[0];
    port = parts[1] || '81';
  }
  return `http://${host}:${port}/stream`;
}

function connectEspCamera() {
  const rawIp = document.getElementById('espIpInput').value.trim();
  if (!rawIp) {
    alert('Vui lòng nhập địa chỉ IP của ESP32!');
    return;
  }
  const streamUrl = formatEspStreamUrl(rawIp);
  localStorage.setItem('esp_cam_ip', rawIp);

  cameraMode = 'esp';
  if (webcamVideo) {
    webcamVideo.style.display = 'none';
  }

  // Bật luồng stream ESP32
  if (espImg) {
    espImg.style.display = 'block';
    espImg.style.transform = espMirrored ? 'scaleX(-1)' : 'none';
    espImg.onload = () => {
      hudStatus.textContent = `🟢 ESP32 đang phát luồng: ${streamUrl}`;
    };
    espImg.onerror = () => {
      hudStatus.innerHTML = `❌ Không tải được luồng từ <b>${streamUrl}</b>. <br>Kiểm tra: 1) ESP32 đã cắm nguồn chưa? 2) Laptop và ESP32 có cùng Wi-Fi không? 3) <a href="${streamUrl}" target="_blank" style="color:#38bdf8;text-decoration:underline;">Thử mở tab mới ↗</a>`;
    };
    espImg.src = streamUrl;
  }

  hudStatus.textContent = `📡 Đang kết nối ESP32: ${streamUrl}...`;
}

// ==========================================
// 4. VÒNG LẶP NHẬN DIỆN KHUÔN MẶT
// ==========================================
// Canvas ngầm để chụp frame tĩnh từ luồng video/stream (chống lỗi buffer MJPEG & CORS)
const captureCanvas = document.createElement('canvas');
const captureCtx = captureCanvas.getContext('2d', { willReadFrequently: true });

async function startDetectionLoop() {
  if (isDetecting) return;
  isDetecting = true;

  const loop = async () => {
    try {
      if (!isModelLoaded) {
        requestAnimationFrame(loop);
        return;
      }

      const inputMedia = (cameraMode === 'webcam') ? webcamVideo : espImg;
      // QUAN TRỌNG: Với luồng MJPEG từ ESP32, KHÔNG ĐƯỢC CHECK espImg.complete vì nó luôn là false!
      const isReady = (cameraMode === 'webcam') 
        ? (webcamVideo.readyState >= 2 && webcamVideo.videoWidth > 0)
        : (espImg.naturalWidth > 0 || espImg.width > 0);

      if (isReady) {
        const displaySize = {
          width: videoStage ? videoStage.clientWidth : (inputMedia.clientWidth || 640),
          height: videoStage ? videoStage.clientHeight : (inputMedia.clientHeight || 480)
        };
        if (overlayCanvas.width !== displaySize.width || overlayCanvas.height !== displaySize.height) {
          overlayCanvas.width = displaySize.width;
          overlayCanvas.height = displaySize.height;
        }

        // Chụp 1 frame tĩnh lên canvas ngầm để AI đọc điểm ảnh ổn định tuyệt đối
        const frameW = inputMedia.videoWidth || inputMedia.naturalWidth || 640;
        const frameH = inputMedia.videoHeight || inputMedia.naturalHeight || 480;
        if (captureCanvas.width !== frameW || captureCanvas.height !== frameH) {
          captureCanvas.width = frameW;
          captureCanvas.height = frameH;
        }
        captureCtx.drawImage(inputMedia, 0, 0, frameW, frameH);

        // Nhận diện TinyFaceDetector - Ngưỡng 0.32 giúp bắt mặt liên tục ngay cả khi nhắm mắt hoặc nghiêng nhẹ
        const detections = await faceapi
          .detectAllFaces(captureCanvas, new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.32 }))
          .withFaceLandmarks(true)
          .withFaceDescriptors();

        const resizedDetections = faceapi.resizeResults(detections, displaySize);
        const ctx = overlayCanvas.getContext('2d');
        ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

        let detectedLabelsInThisFrame = new Set();

        if (resizedDetections.length === 0) {
          kioskLostFaceFrames++;
          hudStatus.textContent = antiSpoofEnabled ? '🛡️ Nghiêm ngặt: Nhìn thẳng vào camera để bắt đầu thử thách...' : '🟢 Đang quét tìm khuôn mặt...';
          if (kioskLostFaceFrames >= 3) {
            Object.keys(livenessState).forEach(k => delete livenessState[k]);
            activeKioskLabel = null;
            Object.keys(consecutiveHits).forEach(k => delete consecutiveHits[k]);
          }
        } else if (resizedDetections.length > 1) {
          kioskLostFaceFrames = 0;
          hudStatus.textContent = '⚠️ Phát hiện nhiều khuôn mặt! Vui lòng chỉ 1 người đứng trước camera.';
          Object.keys(livenessState).forEach(k => delete livenessState[k]);
          activeKioskLabel = null;
          Object.keys(consecutiveHits).forEach(k => delete consecutiveHits[k]);
        } else {
          kioskLostFaceFrames = 0;
          const detection = resizedDetections[0];
          let { box } = detection.detection;
          
          const isMirrored = (cameraMode === 'webcam') || (cameraMode === 'esp' && espMirrored);
          const drawX = isMirrored ? (displaySize.width - box.x - box.width) : box.x;

          let label = 'Người lạ / Chưa học';
          let isMatch = false;
          let isLive = false; // Mặc định luôn là FALSE!
          let confidence = '';

          if (faceMatcher) {
            const bestMatch = faceMatcher.findBestMatch(detection.descriptor);
            const maxDistance = antiSpoofEnabled ? 0.42 : 0.46;
            if (bestMatch.label !== 'unknown' && bestMatch.distance <= maxDistance) {
              label = bestMatch.label;
              isMatch = true;
              confidence = ` (${Math.round((1 - bestMatch.distance) * 100)}%)`;
              detectedLabelsInThisFrame.add(label);

              // Đổi người trước camera -> Hủy ngay phiên của người trước
              if (activeKioskLabel && activeKioskLabel !== label) {
                delete livenessState[activeKioskLabel];
              }
              activeKioskLabel = label;

              let angleTag = '';
              const studentDescObj = labeledDescriptors.find(d => d.label === label);
              if (studentDescObj && studentDescObj.descriptors.length > 1) {
                let minD = 999;
                let minIdx = 0;
                studentDescObj.descriptors.forEach((d, idx) => {
                  const dist = faceapi.euclideanDistance(detection.descriptor, d);
                  if (dist < minD) {
                    minD = dist;
                    minIdx = idx;
                  }
                });
                const angleNames = ['Góc thẳng 0°', 'Lật gương', 'Nghiêng T -9°', 'Nghiêng P +9°', 'Cận cảnh'];
                angleTag = angleNames[minIdx] ? ` · ${angleNames[minIdx]}` : '';
              }

              // Chống ảnh thẻ / màn hình điện thoại bằng State Machine động
              const liveCheck = evaluateLiveness(label, detection.landmarks, box);
              isLive = liveCheck.isLive;

              if (isLive) {
                triggerCheckin(label);
                // XÓA NGAY LẬP TỨC: Không lưu lại trạng thái PASS cũ
                delete livenessState[label];
                activeKioskLabel = null;
                consecutiveHits[label] = 0;
                hudStatus.textContent = `✅ Xác minh người thật thành công: ${label}`;
              } else {
                consecutiveHits[label] = 0;
                hudStatus.textContent = `👁️ ${(label.split(' - ')[1] || label)}${angleTag}: ${liveCheck.prompt}`;
              }
            } else if (bestMatch.label !== 'unknown') {
              label = 'Chưa khớp khuôn mặt';
              isMatch = false;
              Object.keys(livenessState).forEach(k => delete livenessState[k]);
              activeKioskLabel = null;
            } else {
              label = 'Người lạ / Chưa học';
              isMatch = false;
              Object.keys(livenessState).forEach(k => delete livenessState[k]);
              activeKioskLabel = null;
            }
          }

            // Vẽ khung nhận diện
            ctx.lineWidth = 3;
            if (!isMatch) {
              ctx.strokeStyle = '#38bdf8';
              ctx.fillStyle = 'rgba(56, 189, 248, 0.9)';
            } else if (isLive) {
              ctx.strokeStyle = '#22c55e';
              ctx.fillStyle = 'rgba(34, 197, 94, 0.95)';
            } else if (liveCheck && liveCheck.isStaticPhoto) {
              ctx.strokeStyle = '#ef4444'; // Đỏ cảnh báo ảnh tĩnh
              ctx.fillStyle = 'rgba(239, 68, 68, 0.95)';
            } else {
              ctx.strokeStyle = '#f59e0b'; // Màu cam cảnh báo: đang chờ cử động người thật
              ctx.fillStyle = 'rgba(245, 158, 11, 0.95)';
            }

            ctx.strokeRect(drawX, box.y, box.width, box.height);

            // Vẽ label phía trên
            ctx.font = 'bold 12.5px Plus Jakarta Sans, sans-serif';
            let text = label;
            if (isMatch) {
              if (isLive) {
                text = `✓ ` + label + angleTag + confidence;
              } else if (liveCheck && liveCheck.isStaticPhoto) {
                text = `🚫 Nghi vấn ảnh tĩnh (Chặn điểm danh)`;
              } else {
                text = `👁️ Chờ chớp mắt người thật...`;
              }
            }

            const textWidth = ctx.measureText(text).width;
            const labelY = box.y > 26 ? box.y - 26 : box.y;
            ctx.fillRect(drawX, labelY, textWidth + 16, 24);

            ctx.fillStyle = '#ffffff';
            ctx.fillText(text, drawX + 8, labelY + 16);

            // Nếu là khuôn mặt khớp nhưng chưa xác thực người thật: Hiện hướng dẫn trực quan
            if (isMatch && !isLive && antiSpoofEnabled) {
              const prompt = liveCheck?.prompt || 'Vui lòng chớp mắt để điểm danh';
              
              const subY = box.y + box.height + 6;
              const barWidth = Math.max(box.width, 280);
              
              const isStatic = liveCheck && liveCheck.isStaticPhoto;
              ctx.fillStyle = isStatic ? 'rgba(239, 68, 68, 0.95)' : 'rgba(15, 23, 42, 0.92)';
              ctx.fillRect(drawX, subY, barWidth, 24);
              
              ctx.strokeStyle = isStatic ? '#ef4444' : 'rgba(255, 255, 255, 0.2)';
              ctx.lineWidth = 1;
              ctx.strokeRect(drawX, subY, barWidth, 24);

              // Chữ hướng dẫn bên trong
              ctx.font = 'bold 11.5px Plus Jakarta Sans, sans-serif';
              ctx.fillStyle = '#ffffff';
              ctx.fillText(prompt, drawX + 8, subY + 16);
            }
          }
        }
    } catch (err) {
      console.warn('Lỗi trong vòng lặp nhận diện AI:', err);
    } finally {
      // Đảm bảo vòng lặp KHÔNG BAO GIỜ BỊ CHẾT ĐỨNG
      setTimeout(() => { requestAnimationFrame(loop); }, 100);
    }
  };

  requestAnimationFrame(loop);
}

// ==========================================
// 5. ĐIỂM DANH & GỌI SUPABASE
// ==========================================
async function triggerCheckin(label) {
  const mssv = label.split(' - ')[0]?.trim();
  const name = label.split(' - ')[1]?.trim() || mssv;

  const now = Date.now();
  if (lastCheckinTime[mssv] && (now - lastCheckinTime[mssv] < 15000)) {
    return;
  }
  lastCheckinTime[mssv] = now;

  checkedInMssvs.add(mssv);
  renderStudentRoster();

  // Hiển thị Popup & Âm thanh
  showMatchPopup(name, mssv);
  speakGreeting(name);
  playChime();

  if (!currentSession) {
    console.warn('Nhận diện được nhưng không có phiên mở.');
    hudStatus.textContent = `⚠️ Nhận diện: ${name} (${mssv}) — Nhưng chưa có phiên mở!`;
    return;
  }

  try {
    const sessionStartMs = currentSession.started_at ? new Date(currentSession.started_at).getTime() : now;
    const elapsedMin = (now - sessionStartMs) / 60000;
    const lateThresholdMin = (currentSession.warn_before_min && currentSession.warn_before_min > 5)
      ? currentSession.warn_before_min
      : 15;
    const isLate = elapsedMin > lateThresholdMin;
    const targetStatus = isLate ? 'đi muộn' : 'có mặt';
    const lateMinRound = Math.round(elapsedMin);
    const checkinNote = isLate
      ? `Camera ESP32: Đi muộn (+${lateMinRound}p)`
      : 'Camera ESP32 điểm danh AI';

    // 1. Thử RPC admin_set_status (hợp lệ cho Admin và cập nhật audit log)
    const { data: rpcRes, error: rpcErr } = await window.supabase.rpc('admin_set_status', {
      p_session_id: String(currentSession.id),
      p_mssv: mssv,
      p_status: targetStatus,
      p_reason: checkinNote
    });

    // Cập nhật created_at của bảng attendance về đúng thời gian thực vừa quét
    await window.supabase.from('attendance').update({
      created_at: new Date().toISOString(),
      status: targetStatus,
      category: 'Khuôn mặt',
      note: checkinNote
    }).eq('session_id', currentSession.id).eq('mssv', mssv);

    if (rpcErr || !rpcRes?.ok) {
      // Dự phòng ghi trực tiếp bảng attendance nếu chưa có session admin
      await window.supabase.from('attendance').upsert({
        session_id: currentSession.id,
        mssv: mssv,
        full_name: name,
        status: targetStatus,
        category: 'Khuôn mặt',
        note: checkinNote,
        created_at: new Date().toISOString()
      }, { onConflict: 'session_id,mssv' });
    }

    // 3. Bắn tín hiệu sang trang Admin đang mở (nếu có) để đổi màu ngay tức thì
    try {
      const bc = new BroadcastChannel('lh_attendance_sync');
      bc.postMessage({
        type: 'face_checkin',
        sessionId: currentSession.id,
        mssv: mssv,
        name: name,
        time: new Date().toISOString()
      });
      bc.close();
    } catch(e) {}
  } catch (err) {
    console.error('Lỗi gửi điểm danh:', err);
  }
}

function showMatchPopup(name, mssv) {
  const overlay = document.getElementById('bigMatchOverlay');
  const reticle = document.getElementById('targetReticle');
  const st = studentsList.find(s => s.mssv === mssv);
  const avatarUrl = st?.avatar || `images/faces/${mssv}.jpg`;

  const nameEl = document.getElementById('bigMatchName');
  const detailEl = document.getElementById('bigMatchDetail');
  const avatarEl = document.getElementById('bigMatchAvatar');

  if (nameEl) nameEl.textContent = name;
  if (detailEl) detailEl.textContent = `MSSV: ${mssv} · ${new Date().toLocaleTimeString('vi-VN')}`;
  if (avatarEl) avatarEl.src = avatarUrl;

  if (overlay) overlay.classList.add('show');
  if (reticle) reticle.classList.add('matched');

  // Tự động tắt card sau 2.2 giây để đón bạn tiếp theo
  clearTimeout(window._matchPopupTimer);
  window._matchPopupTimer = setTimeout(() => {
    if (overlay) overlay.classList.remove('show');
    if (reticle) reticle.classList.remove('matched');
  }, 2200);

  recentCheckins.unshift({
    name, mssv,
    avatar: avatarUrl,
    time: new Date().toLocaleTimeString('vi-VN', { hour:'2-digit', minute:'2-digit', second:'2-digit' })
  });
  renderHistory();
}

async function handleAdditionalPhotoFiles(files) {
  if (!files || files.length === 0) return;
  const mssv = document.getElementById('studentSelect').value;
  const st = studentsList.find(s => s.mssv === mssv);
  if (!st) return;

  hudStatus.textContent = `⏳ Đang đọc ${files.length} ảnh bổ sung cho ${st.name}...`;

  let db = JSON.parse(localStorage.getItem('face_descriptors_db') || '{}');
  const label = `${st.mssv} - ${st.name}`;
  if (!db[label]) db[label] = [];

  let successCount = 0;
  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    try {
      const img = await faceapi.bufferToImage(file);
      const det = await faceapi
        .detectSingleFace(img, new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.2 }))
        .withFaceLandmarks(true)
        .withFaceDescriptor();
      if (det) {
        db[label].push(Array.from(det.descriptor));
        successCount++;
      }
    } catch(err) {
      console.warn('Lỗi xử lý file upload:', err);
    }
  }

  localStorage.setItem('face_descriptors_db', JSON.stringify(db));
  loadEnrolledFromStorage();
  alert(`✓ Đã nạp thành công thêm ${successCount}/${files.length} ảnh cho ${st.name}!\nHiện sinh viên này có ${db[label].length} vector mẫu nhận diện.`);
  hudStatus.textContent = `🟢 Đã bổ sung ${successCount} ảnh cho ${st.name}. Sẵn sàng điểm danh!`;
}

function renderHistory() {
  const container = document.getElementById('historyList');
  const countEl = document.getElementById('recentCount');
  if (countEl) countEl.textContent = recentCheckins.length;
  if (!container) return;

  if (recentCheckins.length === 0) {
    container.innerHTML = '<div style="color:#64748b;font-size:13px;text-align:center;padding:40px 0;">Chưa có lượt điểm danh nào</div>';
    return;
  }
  container.innerHTML = recentCheckins.slice(0, 25).map(item => `
    <div class="history-item">
      <div class="history-item-left">
        <img class="history-avatar" src="${item.avatar}" onerror="this.src='images/logo.png'">
        <div>
          <div class="history-name">${escapeHtml(item.name)}</div>
          <div class="history-mssv">MSSV: <b style="color:#38bdf8;">${escapeHtml(item.mssv)}</b></div>
        </div>
      </div>
      <div class="history-time">${item.time}</div>
    </div>
  `).join('');
}

// XÓA LỊCH SỬ ĐIỂM DANH (THEO YÊU CẦU NGƯỜI DÙNG)
async function clearAttendanceHistory() {
  if (recentCheckins.length === 0) {
    alert('Lịch sử nhận diện hiện đang trống.');
    return;
  }

  const ok = confirm('Bạn có muốn xóa danh sách lịch sử điểm danh hiển thị trên màn hình không?\n(Sau khi xóa, sinh viên có thể điểm danh lại ngay)');
  if (!ok) return;

  recentCheckins = [];
  lastCheckinTime = {};
  renderHistory();
  const latestCard = document.getElementById('latestMatchCard');
  if (latestCard) latestCard.style.display = 'none';

  if (currentSession && currentSession.id) {
    const delDb = confirm(`Bạn có muốn XÓA LUÔN dữ liệu điểm danh của phiên "${currentSession.session_name}" trên Supabase không?`);
    if (delDb) {
      try {
        const { error } = await window.supabase
          .from('attendance')
          .delete()
          .eq('session_id', currentSession.id);
        if (error) {
          alert('Lỗi xóa trên Supabase: ' + error.message);
        } else {
          alert('✓ Đã xóa sạch dữ liệu điểm danh của phiên này trên Supabase!');
        }
      } catch (err) {
        console.error('Lỗi khi xóa attendance trên Supabase:', err);
      }
    }
  }
}

function playChime() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(587.33, ctx.currentTime);
    osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
    osc.start();
    osc.stop(ctx.currentTime + 0.35);
  } catch (e) {}
}

// ==========================================
// THUẬT TOÁN DATA AUGMENTATION (TỰ ĐỘNG SINH 5 BIẾN THỂ TỪ 1 ẢNH THẺ)
// Giải quyết dứt điểm vấn đề "chỉ có 1 ảnh / người":
// Tự động sinh: Gốc, Lật gương (trái/phải), Nghiêng trái (-9°), Nghiêng phải (+9°), và Zoom cận cảnh (1.12x)
// ==========================================
async function extractAugmentedDescriptors(loadedImg, baseDetection) {
  const descriptors = [Array.from(baseDetection.descriptor)];
  const thumbnails = [];
  const w = loadedImg.width || loadedImg.naturalWidth || 320;
  const h = loadedImg.height || loadedImg.naturalHeight || 320;

  // 1. Ảnh gốc chính diện
  const baseCanvas = document.createElement('canvas');
  baseCanvas.width = 100;
  baseCanvas.height = 100;
  const bCtx = baseCanvas.getContext('2d');
  bCtx.drawImage(loadedImg, 0, 0, 100, 100);
  thumbnails.push({ label: 'Thẳng 0°', url: baseCanvas.toDataURL('image/jpeg', 0.8) });

  const transforms = [
    {
      name: 'Lật gương',
      apply: (ctx) => {
        ctx.translate(w, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(loadedImg, 0, 0, w, h);
      }
    },
    {
      name: 'Nghiêng T',
      apply: (ctx) => {
        ctx.translate(w / 2, h / 2);
        ctx.rotate(-9 * Math.PI / 180);
        ctx.drawImage(loadedImg, -w / 2, -h / 2, w, h);
      }
    },
    {
      name: 'Nghiêng P',
      apply: (ctx) => {
        ctx.translate(w / 2, h / 2);
        ctx.rotate(9 * Math.PI / 180);
        ctx.drawImage(loadedImg, -w / 2, -h / 2, w, h);
      }
    },
    {
      name: 'Cận cảnh',
      apply: (ctx) => {
        ctx.translate(w / 2, h / 2);
        ctx.scale(1.12, 1.12);
        ctx.drawImage(loadedImg, -w / 2, -h / 2, w, h);
      }
    }
  ];

  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d');

  for (const item of transforms) {
    try {
      ctx.save();
      ctx.clearRect(0, 0, w, h);
      item.apply(ctx);
      ctx.restore();

      const det = await faceapi
        .detectSingleFace(canvas, new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.18 }))
        .withFaceLandmarks(true)
        .withFaceDescriptor();

      if (det) {
        descriptors.push(Array.from(det.descriptor));
        // Tạo thumbnail nhỏ 100x100 lưu giao diện
        const tCanvas = document.createElement('canvas');
        tCanvas.width = 100;
        tCanvas.height = 100;
        tCanvas.getContext('2d').drawImage(canvas, 0, 0, 100, 100);
        thumbnails.push({ label: item.name, url: tCanvas.toDataURL('image/jpeg', 0.8) });
      }
    } catch(e) {}
  }

  return { descriptors, thumbnails };
}

function renderAugmentedThumbs(thumbs) {
  const box = document.getElementById('augmentedPreviewBox');
  const strip = document.getElementById('augmentedThumbsStrip');
  const badge = document.getElementById('augmentedCountBadge');
  if (!box || !strip) return;

  if (!thumbs || thumbs.length === 0) {
    box.style.display = 'none';
    return;
  }

  badge.textContent = `${thumbs.length} góc`;
  strip.innerHTML = thumbs.map(t => `
    <div style="text-align:center;background:#0f172a;border:1px solid rgba(56,189,248,0.3);border-radius:6px;padding:3px;overflow:hidden;">
      <img src="${t.url}" style="width:100%;height:46px;object-fit:cover;border-radius:4px;display:block;">
      <div style="font-size:9px;color:#38bdf8;font-weight:800;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${t.label}</div>
    </div>
  `).join('');
  box.style.display = 'block';
}

// ==========================================
// 6. TỰ ĐỘNG NẠP MẶT TỪ ẢNH THẺ CÓ SẴN
// ==========================================
async function enrollFromDocumentPhoto() {
  const mssv = document.getElementById('studentSelect').value;
  if (!mssv) return alert('Vui lòng chọn sinh viên!');

  const st = studentsList.find(s => s.mssv === mssv) || localMapping.find(s => s.mssv === mssv);
  if (!st) return;

  hudStatus.textContent = `⏳ Đang quét và phân tích đa góc mặt cho ${st.name}...`;

  const possibleUrls = [
    st.avatar,
    `images/faces/${st.mssv}.png`,
    `images/faces/${st.mssv}.jpg`,
    `images/faces/${st.mssv}.jpeg`
  ].filter(Boolean);

  let detection = null;
  let loadedImg = null;

  for (const url of possibleUrls) {
    try {
      const img = await faceapi.fetchImage(url);
      detection = await faceapi
        .detectSingleFace(img, new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.22 }))
        .withFaceLandmarks(true)
        .withFaceDescriptor();
      if (detection) {
        loadedImg = img;
        break;
      }
    } catch(e) {}
  }

  if (!detection || !loadedImg) {
    alert(`Không phát hiện được rõ khuôn mặt trong ảnh của ${st.name} (${st.mssv})! Bạn có thể đứng trước camera bấm "Chụp mẫu từ Camera".`);
    hudStatus.textContent = '⚠️ Không tìm thấy mặt trong ảnh thẻ.';
    return;
  }

  // Tự động sinh bộ vector đa góc mặt và ảnh thumbnail trực quan
  const res = await extractAugmentedDescriptors(loadedImg, detection);
  const label = `${st.mssv} - ${st.name}`;
  
  let db = JSON.parse(localStorage.getItem('face_descriptors_db') || '{}');
  db[label] = res.descriptors;
  localStorage.setItem('face_descriptors_db', JSON.stringify(db));

  let thumbDb = JSON.parse(localStorage.getItem('face_thumbnails_db') || '{}');
  thumbDb[label] = res.thumbnails;
  localStorage.setItem('face_thumbnails_db', JSON.stringify(thumbDb));

  // Render 5 ảnh thumbnail trực quan lên màn hình ngay lập tức!
  renderAugmentedThumbs(res.thumbnails);

  alert(`✓ Đã nạp thành công khuôn mặt của ${st.name} (${st.mssv})!\nNhìn vào khung bên dưới để xem trực quan ${res.descriptors.length} ảnh góc mặt vừa sinh.`);
  loadEnrolledFromStorage();
  hudStatus.textContent = `🟢 Đã nạp xong ${res.descriptors.length} góc cho ${st.name}. Bạn có thể đứng trước camera test ngay!`;
}

async function enrollAll30Students() {
  if (!confirm('Bạn có muốn tự động quét và nạp khuôn mặt của cả 30 thành viên từ tài liệu vào hệ thống không? (Hệ thống sẽ tự sinh đa góc nghiêng cho từng người)')) return;

  hudStatus.textContent = '⏳ Đang tự động nạp khuôn mặt cả đội...';
  let successCount = 0;
  let totalVectors = 0;
  let db = JSON.parse(localStorage.getItem('face_descriptors_db') || '{}');
  let thumbDb = JSON.parse(localStorage.getItem('face_thumbnails_db') || '{}');

  const sourceList = (localMapping && localMapping.length > 0) ? localMapping : studentsList;
  const total = sourceList.length;

  for (let i = 0; i < total; i++) {
    const st = sourceList[i];
    if (!st.mssv) continue;

    hudStatus.textContent = `⏳ Đang nạp & sinh đa góc (${i + 1}/${total}): ${st.name}...`;

    const possibleUrls = [
      st.avatar,
      `images/faces/${st.mssv}.png`,
      `images/faces/${st.mssv}.jpg`,
      `images/faces/${st.mssv}.jpeg`
    ].filter(Boolean);

    let detection = null;
    let loadedImg = null;

    for (const url of possibleUrls) {
      try {
        const img = await faceapi.fetchImage(url);
        detection = await faceapi
          .detectSingleFace(img, new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.22 }))
          .withFaceLandmarks(true)
          .withFaceDescriptor();
        if (detection) {
          loadedImg = img;
          break;
        }
      } catch(e) {}
    }

    if (detection && loadedImg) {
      const res = await extractAugmentedDescriptors(loadedImg, detection);
      const label = `${st.mssv} - ${st.name}`;
      db[label] = res.descriptors;
      thumbDb[label] = res.thumbnails;
      successCount++;
      totalVectors += res.descriptors.length;

      // Hiển thị preview 5 góc của bạn đầu tiên
      if (successCount === 1) {
        renderAugmentedThumbs(res.thumbnails);
      }
    } else {
      console.warn(`Chưa nhận diện được mặt từ ảnh của ${st.name} (${st.mssv})`);
    }
  }

  localStorage.setItem('face_descriptors_db', JSON.stringify(db));
  localStorage.setItem('face_thumbnails_db', JSON.stringify(thumbDb));
  loadEnrolledFromStorage();
  alert(`✓ Đã nạp thành công khuôn mặt của ${successCount}/${total} sinh viên!\nTổng cộng đã sinh ra ${totalVectors} vector đặc trưng đa góc.`);
  hudStatus.textContent = `🟢 Đã nạp xong ${successCount}/${total} bạn (${totalVectors} vector). Hệ thống sẵn sàng!`;
}

// Chụp trực tiếp từ camera
function resetSampleCollector() {
  tempSamples = [];
  document.getElementById('sampleCount').textContent = '0';
  document.getElementById('btnSaveEnroll').disabled = true;
}

async function captureFaceSample() {
  const mssv = document.getElementById('studentSelect').value;
  const st = studentsList.find(s => s.mssv === mssv);
  if (!st) return alert('Vui lòng chọn sinh viên!');

  if (cameraMode === 'webcam' && (!webcamVideo.srcObject || webcamVideo.readyState < 2)) {
    return alert('Webcam chưa sẵn sàng! Vui lòng bật webcam trước.');
  }
  if (cameraMode === 'esp' && (!espImg.complete || espImg.naturalWidth === 0)) {
    return alert('Chưa kết nối được luồng camera ESP32! Vui lòng kiểm tra IP và bấm "Kết nối".');
  }

  const inputMedia = (cameraMode === 'webcam') ? webcamVideo : espImg;
  const detection = await faceapi
    .detectSingleFace(inputMedia, new faceapi.TinyFaceDetectorOptions({ scoreThreshold: 0.5 }))
    .withFaceLandmarks(true)
    .withFaceDescriptor();

  if (!detection) {
    alert('Không tìm thấy khuôn mặt rõ ràng! Hãy đứng trước camera và đủ sáng.');
    return;
  }

  tempSamples.push(Array.from(detection.descriptor));
  const count = tempSamples.length;
  document.getElementById('sampleCount').textContent = count;
  playChime();

  if (count >= 3) {
    document.getElementById('btnSaveEnroll').disabled = false;
    alert('Đã đủ 3 mẫu mặt! Bấm nút "Lưu khuôn mặt đã chụp" để hoàn tất.');
  }
}

function saveEnrolledFace() {
  const mssv = document.getElementById('studentSelect').value;
  const st = studentsList.find(s => s.mssv === mssv);
  if (!st || tempSamples.length === 0) return;

  const label = `${st.mssv} - ${st.name}`;
  let db = JSON.parse(localStorage.getItem('face_descriptors_db') || '{}');
  db[label] = tempSamples;
  localStorage.setItem('face_descriptors_db', JSON.stringify(db));

  alert(`✓ Đã lưu khuôn mặt chụp cho ${st.name}!`);
  resetSampleCollector();
  loadEnrolledFromStorage();
  switchTab('recent');
}

function loadEnrolledFromStorage() {
  const db = JSON.parse(localStorage.getItem('face_descriptors_db') || '{}');
  labeledDescriptors = [];

  const keys = Object.keys(db);
  const enrolledEl = document.getElementById('enrolledCount');
  if (enrolledEl) enrolledEl.textContent = keys.length;

  keys.forEach(label => {
    const descriptors = db[label].map(arr => new Float32Array(arr));
    labeledDescriptors.push(new faceapi.LabeledFaceDescriptors(label, descriptors));
  });

  updateFaceMatcher();
}

async function autoAugmentMissingFaces() {
  try {
    const db = JSON.parse(localStorage.getItem('face_descriptors_db') || '{}');
    const thumbDb = JSON.parse(localStorage.getItem('face_thumbnails_db') || '{}');
    const sourceList = (localMapping && localMapping.length > 0) ? localMapping : studentsList;
    const missing = sourceList.filter(s => s.mssv && !db[`${s.mssv} - ${s.name}`]);
    if (missing.length === 0) return;

    let count = 0;
    for (const st of missing) {
      const possibleUrls = [
        st.avatar,
        `images/faces/${st.mssv}.png`,
        `images/faces/${st.mssv}.jpg`,
        `images/faces/${st.mssv}.jpeg`
      ].filter(Boolean);

      for (const url of possibleUrls) {
        try {
          const img = await faceapi.fetchImage(url);
          const det = await faceapi
            .detectSingleFace(img, new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.22 }))
            .withFaceLandmarks(true)
            .withFaceDescriptor();
          if (det) {
            const res = await extractAugmentedDescriptors(img, det);
            const label = `${st.mssv} - ${st.name}`;
            db[label] = res.descriptors;
            thumbDb[label] = res.thumbnails;
            count++;
            break;
          }
        } catch(e) {}
      }
    }

    if (count > 0) {
      localStorage.setItem('face_descriptors_db', JSON.stringify(db));
      localStorage.setItem('face_thumbnails_db', JSON.stringify(thumbDb));
      loadEnrolledFromStorage();
      renderStudentRoster();
    }
  } catch(e) {
    console.warn('autoAugmentMissingFaces:', e);
  }
}

async function syncFaceDataFromServer(){
  try {
    const { data, error } = await window.supabase.from('student_face_data').select('mssv, descriptors, thumbnails, updated_at');
    if (error) throw error;
    const rows = data || [];
    let localDb = JSON.parse(localStorage.getItem('face_descriptors_db') || '{}');
    let localThumb = JSON.parse(localStorage.getItem('face_thumbnails_db') || '{}');
    let merged = 0;
    rows.forEach(row => {
      const mssv = row.mssv;
      const st = studentsList.find(s => s.mssv === mssv) || localMapping.find(s => s.mssv === mssv);
      const name = st ? st.name : mssv;
      const label = mssv + ' - ' + name;
      const descs = row.descriptors || [];
      const thumbs = row.thumbnails || [];
      const valid = descs.filter(d => d);
      if (valid.length > 0) {
        localDb[label] = valid;
        localThumb[label] = thumbs.filter(t => t);
        merged++;
      }
    });
    localStorage.setItem('face_descriptors_db', JSON.stringify(localDb));
    localStorage.setItem('face_thumbnails_db', JSON.stringify(localThumb));
    loadEnrolledFromStorage();
    renderStudentRoster();
  } catch(e) {
    console.error('syncFaceDataFromServer:', e);
  }
}

async function deleteServerFaceData(mssv, name){
  if (!confirm('Xóa toàn bộ dữ liệu khuôn mặt của ' + name + ' (' + mssv + ') trên Server? Hành động không thể hoàn tác.')) return;
  try {
    const { error } = await window.supabase.from('student_face_data').delete().eq('mssv', mssv);
    if (error) throw error;
    let localDb = JSON.parse(localStorage.getItem('face_descriptors_db') || '{}');
    let localThumb = JSON.parse(localStorage.getItem('face_thumbnails_db') || '{}');
    const label = mssv + ' - ' + name;
    delete localDb[label]; delete localThumb[label];
    localStorage.setItem('face_descriptors_db', JSON.stringify(localDb));
    localStorage.setItem('face_thumbnails_db', JSON.stringify(localThumb));
    loadEnrolledFromStorage();
    await syncFaceDataFromServer();
    document.getElementById('serverFaceStatus').textContent = '✓ Đã xóa dữ liệu khuôn mặt của ' + name;
  } catch(e) {
    alert('Lỗi xóa: ' + e.message);
  }
}

function updateFaceMatcher() {
  // Khoảng cách 0.48: Tối ưu cho camera ESP32 OV2640, nhận diện nhạy mà không nhận nhầm người khác
  faceMatcher = (labeledDescriptors.length > 0) ? new faceapi.FaceMatcher(labeledDescriptors, 0.48) : null;
}

function exportFaceDb() {
  const data = localStorage.getItem('face_descriptors_db') || '{}';
  const blob = new Blob([data], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `face_db_${Date.now()}.json`;
  a.click();
}

// UI TABS
function switchTab(tab) {
  const btnRecent = document.getElementById('tabBtnRecent');
  const btnRoster = document.getElementById('tabBtnRoster');
  const paneRecent = document.getElementById('tabRecent');
  const paneRoster = document.getElementById('tabRoster');
  if (btnRecent) btnRecent.classList.toggle('active', tab === 'recent');
  if (btnRoster) btnRoster.classList.toggle('active', tab === 'roster');
  if (paneRecent) paneRecent.classList.toggle('active', tab === 'recent');
  if (paneRoster) paneRoster.classList.toggle('active', tab === 'roster');
}

function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
  else document.exitFullscreen().catch(() => {});
}
